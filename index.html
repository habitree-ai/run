<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>러닝 누적기록 · 집계 대시보드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
<style>
  :root{color-scheme:light;
    --surface-1:#fcfcfb;--plane:#f9f9f7;--text-primary:#0b0b0b;--text-secondary:#52514e;--muted:#898781;
    --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,0.10);--series-1:#2a78d6;--series-1-soft:#cde2fb;
    --seq-550:#1c5cab;--seq-700:#0d366b;--good:#0ca30c;--good-text:#006300;--warn:#b26a00;--warn-soft:#fdecc8;
    --guide-beta:#b26a00;--guide-alpha:#7c5cd6; /* β·α 기준선 — CVD 검증 통과 조합(실적 파랑과 함께) */
    --radius:14px;--shadow:0 1px 2px rgba(11,11,11,.04),0 4px 16px rgba(11,11,11,.05);
    --font:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Consolas,monospace;}
  :root[data-theme="dark"]{color-scheme:dark;
    --surface-1:#1a1a19;--plane:#0d0d0d;--text-primary:#fff;--text-secondary:#c3c2b7;--muted:#898781;
    --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,0.10);--series-1:#3987e5;--series-1-soft:#184f95;
    --seq-550:#6da7ec;--seq-700:#b7d3f6;--good:#0ca30c;--good-text:#0ca30c;--warn:#fab219;--warn-soft:#3a2f10;
    --guide-beta:#c27a00;--guide-alpha:#8668d8;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
    --surface-1:#1a1a19;--plane:#0d0d0d;--text-primary:#fff;--text-secondary:#c3c2b7;--muted:#898781;
    --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,0.10);--series-1:#3987e5;--series-1-soft:#184f95;
    --seq-550:#6da7ec;--seq-700:#b7d3f6;--good-text:#0ca30c;--warn:#fab219;--warn-soft:#3a2f10;
    --guide-beta:#c27a00;--guide-alpha:#8668d8;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);}}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--plane);color:var(--text-primary);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--series-1);text-decoration:none}a:hover{text-decoration:underline}
  button{font-family:inherit}
  /* top bar */
  header.top{border-bottom:1px solid var(--border);background:var(--surface-1);position:sticky;top:0;z-index:30}
  .top-inner{display:flex;align-items:center;gap:14px;padding:11px 20px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--series-1),var(--seq-550));display:grid;place-items:center;color:#fff}
  .brand h1{font-size:15.5px;margin:0;letter-spacing:-.01em}
  .brand .sub{font-size:11.5px;color:var(--muted)}
  .draft-badge{font-size:10.5px;font-weight:700;color:#fff;background:var(--series-1);padding:2px 8px;border-radius:999px;margin-left:2px}
  .spacer{flex:1}
  .storage-pill{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-secondary);
    border:1px solid var(--border);border-radius:999px;padding:4px 11px;background:var(--plane);cursor:pointer}
  .storage-pill .d{width:8px;height:8px;border-radius:50%;background:var(--warn)}
  .storage-pill.connected .d{background:var(--good)}
  .docnav{display:flex;gap:2px}
  .docnav a{padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-secondary)}
  .docnav a.active{background:var(--series-1-soft);color:var(--seq-700)}
  :root[data-theme="dark"] .docnav a.active{color:#fff}
  .toggle{border:1px solid var(--border);background:transparent;color:var(--text-secondary);width:34px;height:34px;border-radius:9px;cursor:pointer;display:grid;place-items:center}
  .toggle:hover{background:var(--plane)}
  /* layout */
  .shell{display:grid;grid-template-columns:210px 1fr;gap:0;min-height:calc(100vh - 58px)}
  @media(max-width:820px){.shell{grid-template-columns:1fr}}
  nav.rail{border-right:1px solid var(--border);background:var(--surface-1);padding:16px 12px}
  @media(max-width:820px){nav.rail{border-right:none;border-bottom:1px solid var(--border);display:flex;gap:6px;overflow:auto}}
  nav.rail button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:transparent;
    color:var(--text-secondary);font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
  nav.rail button:hover{background:var(--plane)}
  nav.rail button.active{background:var(--series-1-soft);color:var(--seq-700)}
  :root[data-theme="dark"] nav.rail button.active{color:#fff}
  nav.rail button svg{width:17px;height:17px;flex:none}
  nav.rail .rail-h{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 12px;margin-top:8px}
  main.stage{padding:24px 26px 60px;max-width:1000px;min-width:0}
  h2.vh{font-size:20px;letter-spacing:-.01em;margin:0 0 4px}
  .vsub{color:var(--muted);font-size:13px;margin:0 0 20px}
  /* cards / kpi */
  .card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
  .statrow{display:flex;flex-wrap:wrap;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:5px 0}
  .statrow .st{flex:1;min-width:130px;text-align:center;padding:11px 8px;border-left:1px solid var(--border)}
  .statrow .st:first-child{border-left:none}
  .statrow .label{font-size:11.5px;color:var(--text-secondary)}
  .statrow .val{font-size:21px;font-weight:750;letter-spacing:-.02em;margin-top:2px;line-height:1.1}
  .statrow .val small{font-size:12px;font-weight:600;color:var(--muted);margin-left:1px}
  .statrow .foot{font-size:10.5px;color:var(--muted);margin-top:1px}
  /* β(계획)·α(목표) 표기 */
  .bB{color:var(--guide-beta);font-weight:750}
  .bA{color:var(--guide-alpha);font-weight:750}
  .chipB,.chipA{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 8px;border-radius:999px;vertical-align:1px}
  .chipB{color:var(--guide-beta);background:rgba(178,106,0,.12)}
  .chipA{color:var(--guide-alpha);background:rgba(124,92,214,.13)}
  :root[data-theme="dark"] .chipB{background:rgba(194,122,0,.2)}
  :root[data-theme="dark"] .chipA{background:rgba(134,104,216,.22)}
  @media(prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .chipB{background:rgba(194,122,0,.2)}
    :root:not([data-theme="light"]) .chipA{background:rgba(134,104,216,.22)}}
  /* backends */
  .backends{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:6px}
  .be{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
  .be .be-h{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
  .be .be-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--series-1-soft);color:var(--seq-700)}
  :root[data-theme="dark"] .be .be-ic{color:#dbe9ff}
  .be p{font-size:12.5px;color:var(--text-secondary);margin:0;flex:1;line-height:1.5}
  .be .tag{align-self:flex-start;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px}
  .tag.rec{background:var(--good);color:#fff}
  .tag.soon{background:var(--warn-soft);color:var(--warn)}
  .btn{border:1px solid var(--series-1);background:var(--series-1);color:#fff;font-weight:600;font-size:13px;
    padding:9px 14px;border-radius:10px;cursor:pointer;transition:opacity .12s}
  .btn:hover{opacity:.9}
  .btn.ghost{background:transparent;color:var(--series-1)}
  .btn.sec{background:transparent;color:var(--text-secondary);border-color:var(--border)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:6px 11px;font-size:12px}
  label.btn{display:inline-block}
  /* forms */
  .form{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);max-width:640px}
  .fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.fg{grid-template-columns:1fr}}
  .field label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:5px;font-weight:600}
  .field input,.field select{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13.5px;
    background:var(--plane);color:var(--text-primary);font-family:inherit}
  .field input:focus,.field select:focus{outline:2px solid var(--series-1-soft);border-color:var(--series-1)}
  .field input.warn{border-color:var(--warn)}
  .field .hint{font-size:11px;color:var(--muted);margin-top:3px}
  .form-actions{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
  .note{font-size:12.5px;color:var(--text-secondary);background:var(--series-1-soft);border-radius:10px;padding:11px 13px;line-height:1.5}
  :root[data-theme="dark"] .note{background:rgba(57,135,229,.12)}
  .note.warn{background:var(--warn-soft);color:var(--warn)}
  .drop{display:block;border:2px dashed var(--border);border-radius:12px;padding:26px;text-align:center;color:var(--muted);font-size:13px;background:var(--plane);cursor:pointer;transition:border-color .12s,background .12s}
  .drop.over,.drop:hover{border-color:var(--series-1);color:var(--series-1)}
  /* table */
  table.data{border-collapse:collapse;width:100%;font-size:13px;background:var(--surface-1);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  table.data th{background:var(--series-1-soft);color:var(--seq-700);text-align:left;padding:9px 11px;font-size:11.5px;font-weight:700;white-space:nowrap}
  :root[data-theme="dark"] table.data th{color:#dbe9ff;background:#17324f}
  table.data td{padding:8px 11px;border-top:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums}
  table.data tbody tr:hover{background:var(--plane)}
  .src{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px}
  .src.seed{background:var(--warn-soft);color:var(--warn)}
  .src.manual{background:var(--series-1-soft);color:var(--seq-700)}
  .src.ocr{background:#e7f6ee;color:#0a7a43}
  .src.import{background:#eee;color:#555}
  .src.drive{background:#eef;color:#4a3aa7}
  .src.posted{background:#e7f6ee;color:#0a7a43;cursor:pointer}
  :root[data-theme="dark"] .src.manual{color:#dbe9ff}
  :root[data-theme="dark"] .src.import{background:#333;color:#bbb}
  .del{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
  .del:hover{color:#d03b3b}
  .edit{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
  .edit:hover{color:var(--series-1)}
  /* charts */
  .chart-card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 17px 10px}
  .chart-card h3{margin:0;font-size:14px;font-weight:700}.chart-card .cs{font-size:11.5px;color:var(--muted);margin:2px 0 6px}
  .grid2a{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:760px){.grid2a{grid-template-columns:1fr}}
  svg.chart{width:100%;height:auto;display:block;overflow:visible}
  .tick{fill:var(--muted);font-size:10px;font-family:var(--font);font-variant-numeric:tabular-nums}
  .gridline{stroke:var(--grid);stroke-width:1}.baseline{stroke:var(--axis);stroke-width:1}
  .bar{fill:var(--series-1)}.bar:hover{opacity:.82;cursor:pointer}
  .linepath{fill:none;stroke:var(--series-1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .area{fill:var(--series-1);opacity:.08}.dot-m{fill:var(--surface-1);stroke:var(--series-1);stroke-width:2}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 10px;border:1px dashed var(--border);border-radius:12px}
  /* goals */
  .goalcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(218px,1fr));gap:12px;margin-top:12px}
  .goal-row{margin-top:12px}
  .goal-top{display:flex;justify-content:space-between;gap:4px 8px;font-size:12px;color:var(--text-secondary);margin-bottom:5px;flex-wrap:wrap}
  .goal-top>span{white-space:nowrap}
  .goalcards .card{word-break:keep-all}
  .goal-top b{font-variant-numeric:tabular-nums;color:var(--text-primary);font-weight:650;text-align:right}
  .goal-top b .bB,.goal-top b .bA{white-space:nowrap} /* '계획 10' 묶음 단위로만 줄바꿈 */
  .gbar{height:8px;background:var(--grid);border-radius:999px;overflow:hidden}
  .gfill{height:100%;background:var(--series-1);border-radius:999px;transition:width .3s}
  .gfill.done{background:var(--good)}
  .goal-h{font-size:13px;font-weight:700;margin:0}
  .sect{margin:26px 0 8px;font-size:15px;font-weight:700}
  /* images */
  .thumb{width:42px;height:42px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--border);cursor:pointer;background:var(--plane);display:block}
  .thumb.sm{width:34px;height:34px}
  .imgprev{max-width:230px;max-height:300px;object-fit:contain;border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow);display:block;background:var(--plane)}
  .addwrap{display:grid;grid-template-columns:minmax(0,640px);gap:14px}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;z-index:50;padding:20px}
  .modal-bg.open{display:grid}
  .modal{background:var(--surface-1);border:1px solid var(--border);border-radius:16px;max-width:480px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 10px;font-size:17px}
  .modal p{font-size:13.5px;color:var(--text-secondary);line-height:1.6}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text-primary);
    color:var(--surface-1);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.2s;z-index:60;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .tooltip{position:fixed;pointer-events:none;z-index:70;background:var(--text-primary);color:var(--surface-1);font-size:12px;padding:6px 9px;border-radius:8px;opacity:0;transition:opacity .1s;white-space:nowrap;font-variant-numeric:tabular-nums}
  .hide{display:none!important}
</style>
</head>

<script>
/* ============ 유틸 ============ */
const $=s=>document.querySelector(s), root=document.documentElement;
const pad=n=>String(n).padStart(2,'0');
const WD=['일','월','화','수','목','금','토'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function paceTxt(s){if(!s&&s!==0)return '—';return Math.floor(s/60)+"'"+pad(Math.round(s%60))+'"';}
function clock(s){if(!s&&s!==0)return '—';const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.round(s%60);return h?h+':'+pad(m)+':'+pad(x):m+':'+pad(x);}
function parsePace(t){const m=(t||'').match(/(\d+)\s*['′’:]\s*(\d{1,2})/);return m?(+m[1]*60+ +m[2]):null;}
function parseClock(t){t=(t||'').trim();if(!t)return null;const p=t.split(':').map(Number);if(p.some(isNaN))return null;
  if(p.length===3)return p[0]*3600+p[1]*60+p[2];if(p.length===2)return p[0]*60+p[1];if(p.length===1)return p[0]*60;return null;}
function isoWeekKey(d){const dt=new Date(d+'T00:00:00');const day=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-day);return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
const monthKey=d=>String(d).slice(0,7);
const yearKey=d=>String(d).slice(0,4);
function todayISO(){const t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900);}

/* ============ 상태 ============ */
const state={records:[], goals:null, deletedIds:[], backend:'local', pendingImage:null, pendingRawOcr:null, editingId:null,
  pendingDrive:null, driveQueue:null, driveTotal:0, pendingAnchor:null, batch:null};

/* ============ 영속화 (localStorage) ============ */
const LS_RECORDS='run.records.v2', LS_GOALS='run.goals.v1', LS_DELETED='run.deleted.v1';
const NUM_FIELDS=['distance_km','duration_sec','avg_pace_sec_per_km','elevation_gain_m','cadence_spm','avg_heart_rate_bpm'];
let _idSeq=0;
function migrateRecord(r){
  if(!r||typeof r!=='object')return r;
  delete r.calories;r.schema_version='2.0';
  NUM_FIELDS.forEach(k=>{if(r[k]!=null){const n=Number(r[k]);r[k]=isFinite(n)?n:null;}});
  if(r.title!=null)r.title=String(r.title);

  if(r.image_url!=null){const u=String(r.image_url).trim(); /* javascript: 등 위험 스킴 차단 */
    r.image_url=(/^https?:\/\//i.test(u)||!u.includes(':'))&&u?u:null;}
  if(r.blog_posted_at!=null)r.blog_posted_at=String(r.blog_posted_at);
  return r;
}
function normalizeRecords(arr){ /* 외부 JSON 유입 대비: 날짜 형식·record_id 검증/재발급 */
  const seen=new Set();
  return arr.filter(r=>r&&typeof r==='object'&&/^\d{4}-\d{2}-\d{2}$/.test(String(r.date||''))).map(r=>{
    r=migrateRecord(r);r.date=String(r.date);
    if(!r.record_id||!/^[A-Za-z0-9_-]+$/.test(String(r.record_id))||seen.has(r.record_id))
      r.record_id='r'+Date.now()+'_'+(_idSeq++);
    else r.record_id=String(r.record_id);
    seen.add(r.record_id);
    return r;
  });
}

function defaultGoals(){ /* 27년까지 2중 기준 — 계획 β(반드시 지킬 최소) · 목표 α(도전) — 페이스는 초/km */
  return {
    plan:{weekly:{runs:3,distance_km:10}, monthly:{runs:15,distance_km:45}, yearly:{runs:180,distance_km:540}, pace_stable:315, pace_record:270},
    target:{weekly:{runs:5,distance_km:15}, monthly:{runs:20,distance_km:60}, yearly:{runs:240,distance_km:720}, pace_stable:300, pace_record:240},
    horizon:'2027'
  };
}
function sanitizeGoals(g){ /* 외부 JSON 유입 대비: 유한 양수만 허용 · 구(단일) 구조는 계획 β로 이관 */
  const d=defaultGoals(),n=v=>{const x=Number(v);return isFinite(x)&&x>0?x:null;};
  const period=(src,def)=>{if(!src||typeof src!=='object')return {...def};
    return {runs:'runs'in src?n(src.runs):def.runs, distance_km:'distance_km'in src?n(src.distance_km):def.distance_km};};
  const tier=(src,def)=>({weekly:period(src&&src.weekly,def.weekly), monthly:period(src&&src.monthly,def.monthly),
    yearly:period(src&&src.yearly,def.yearly),
    pace_stable:src&&'pace_stable'in src?n(src.pace_stable):def.pace_stable,
    pace_record:src&&'pace_record'in src?n(src.pace_record):def.pace_record});
  g=g&&typeof g==='object'?g:null;
  if(g&&!g.plan&&(g.weekly||g.monthly||g.yearly)){ /* v1 단일 목표 → 계획(β)로 이관, 미설정 값은 새 기본값 */
    const mig=p=>{if(!p||typeof p!=='object')return null;const q={...p};
      if(q.distance_km==null)delete q.distance_km;if(q.runs==null)delete q.runs;return q;};
    g={plan:{weekly:mig(g.weekly),monthly:mig(g.monthly),yearly:mig(g.yearly)},target:null,updated_at:g.updated_at};
  }
  const out={plan:tier(g&&g.plan,d.plan), target:tier(g&&g.target,d.target), horizon:'2027'};
  if(g&&g.start_date&&/^\d{4}-\d{2}-\d{2}$/.test(String(g.start_date)))out.start_date=String(g.start_date); /* 계획 시작점 */
  if(g&&g.updated_at)out.updated_at=String(g.updated_at);
  return out;
}

/* ============ 이미지 저장 (IndexedDB) ============ */
let _dbp=null;
function idb(){
  if(!_dbp){_dbp=new Promise((res,rej)=>{
    if(!window.indexedDB){rej(new Error('IndexedDB 미지원'));return;}
    const rq=indexedDB.open('run-app',1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore('images');
    rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});
    _dbp.catch(()=>{_dbp=null;});}
  return _dbp;
}
function txDone(tx,res,rej){tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('IDB 트랜잭션 중단(저장 공간 부족 가능)'));}
async function imgPut(id,blob){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(blob,id);txDone(tx,res,rej);});}
async function imgGet(id){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('images');const rq=tx.objectStore('images').get(id);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);tx.onabort=()=>rej(tx.error||new Error('IDB 트랜잭션 중단'));});}
async function imgDel(id){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').delete(id);txDone(tx,res,rej);});}
async function imgClear(){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').clear();txDone(tx,res,rej);});}
const objUrls=new Map();
async function imgUrl(rec){
  if(rec.has_image){
    if(objUrls.has(rec.record_id))return objUrls.get(rec.record_id);

    return rec.image_url||null;
  }
  return rec.image_url||null;
}
function revokeImg(id){if(objUrls.has(id)){URL.revokeObjectURL(objUrls.get(id));objUrls.delete(id);}}

function batchWarn(p){ /* 원클릭 저장 가능 여부 — 의심 사유 반환 */
  if(!p.date)return '날짜를 정하지 못했습니다';
  if(!(p.distance_km>0))return '거리를 읽지 못했습니다';
  if(paceTimeMismatch(p.distance_km,p.avg_pace_sec_per_km,p.duration_sec))return '거리·페이스·시간 불일치';
  return null;
}
async function processBatch(){
  const b=state.batch;
  for(let i=0;i<b.items.length;i++){
    if(state.batch!==b)return; /* 뷰 이탈로 배치 폐기됨 */
    const it=b.items[i];
    try{
      const [blob,meta]=await Promise.all([downloadDriveFile(it.id),driveFileMeta(it.id)]);
      if(state.batch!==b)return;
      it.file=new File([blob],it.name,{type:blob.type||'image/png'});
      it.thumbUrl=URL.createObjectURL(blob);
      it.anchor=buildAnchor(it.name,meta,null);
      updateBatchCard(i);
      const res=await new Promise(r=>runOCR(it.file,it.anchor,(parsed,err,raw)=>r({parsed,err,raw})));
      if(state.batch!==b)return;
      const p=res.parsed||{};
      if(it.anchor){p.date=p.date||it.anchor.date;p.start_time=p.start_time||it.anchor.time;} /* OCR이 못 채운 칸만 앵커로 */
      it.parsed=p;it.raw=res.raw||null;
      it.warn=res.err?'인식 실패 — 수정에서 직접 입력':batchWarn(p);
      it.status=it.warn?'suspect':'ready';
      updateBatchCard(i);
    }catch(e){it.status='error';it.warn='다운로드 실패';updateBatchCard(i);}
  }
}

async function saveBatchItem(i){ /* 카드에서 원클릭 저장 */
  const it=state.batch&&state.batch.items[i];

    start_time:p.start_time||null, day_part:p.start_time?(+p.start_time.slice(0,2)<12?'오전':'오후'):null,
    title:p.title||'러닝', location:p.location||null,
    distance_km:p.distance_km,
    avg_pace_sec_per_km:p.avg_pace_sec_per_km||null, duration_sec:p.duration_sec||null,
    elevation_gain_m:p.elevation_gain_m??null, cadence_spm:p.cadence_spm||null, avg_heart_rate_bpm:p.avg_heart_rate_bpm||null});
  const rec={record_id:'r'+Date.now()+'_'+i, ...fields, source:'drive', source_file_id:it.id,
    original_filename:it.name, has_image:false, image_url:null, raw_ocr:it.raw||null,
    created_at:new Date().toISOString(), updated_at:new Date().toISOString(), schema_version:'2.0'};
  state.records.push(rec);

async function nextDriveItem(){
  if(!state.driveQueue||!state.driveQueue.length){
    if(state.driveTotal>0&&_drvSkipped)toast('드라이브 가져오기 완료 — 저장 '+_drvSaved+'장 · 건너뜀 '+_drvSkipped+'장');
    state.driveQueue=null;state.driveTotal=0;updateQueueCtl();return;
  }
  const item=state.driveQueue.shift();
  const pos=state.driveTotal-state.driveQueue.length;
  if(current!=='add'||!$('#ocrStatus'))return;
  $('#ocrStatus').textContent='드라이브에서 다운로드 중… ('+pos+'/'+state.driveTotal+' · '+item.name+')';
  try{
    const [blob,meta]=await Promise.all([downloadDriveFile(item.id),driveFileMeta(item.id)]);
    if(current!=='add')return;
    state.pendingDrive={id:item.id,name:item.name||'capture.png'};
    state.pendingAnchor=buildAnchor(item.name,meta,null); /* 날짜 앵커 — 파일명 → EXIF → 드라이브 저장일 */
    handleFile(new File([blob],item.name||'capture.png',{type:blob.type||'image/png'}));
  }catch(e){
    toast((item.name||'파일')+' 다운로드 실패');
    nextDriveItem();
  }
}
let _drvSaved=0,_drvSkipped=0;
function updateQueueCtl(){ /* 드라이브 큐 진행 표시 + 건너뛰기·취소 (planning §4) */
  const el=$('#queueCtl');if(!el)return;
  if(state.driveTotal>0&&state.pendingDrive){
    const pos=state.driveTotal-(state.driveQueue?state.driveQueue.length:0);
    el.classList.remove('hide');
    el.innerHTML='드라이브 큐 <b>'+pos+'/'+state.driveTotal+'</b> · <a href="#" onclick="skipDriveItem();return false">이 캡쳐 건너뛰기</a>'+
      (state.driveQueue&&state.driveQueue.length?' · <a href="#" onclick="cancelDriveQueue();return false">나머지 '+state.driveQueue.length+'장 취소</a>':'');
  }else{el.classList.add('hide');el.innerHTML='';}
}
function skipDriveItem(){ /* 이 캡쳐는 저장하지 않고 다음으로 */
  if(!state.pendingDrive&&!(state.driveQueue&&state.driveQueue.length))return;
  _drvSkipped++;

function cancelDriveQueue(){

async function downloadDriveFile(id){
  const token=await driveToken();
  const r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?alt=media',{headers:{Authorization:'Bearer '+token}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.blob();
}
async function driveFileMeta(id){ /* 날짜 앵커용 메타(EXIF·저장일) — 실패해도 무해 */
  try{
    const token=await driveToken();
    const r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?fields=name,createdTime,imageMediaMetadata(time)',{headers:{Authorization:'Bearer '+token}});
    return r.ok?await r.json():null;
  }catch(e){return null;}
}
async function uploadDataset(){ /* running_records.json 생성/갱신 — 수동 백업·자동 동기화 공용 */
  const token=await driveToken();
  const s=driveSettings();
  const doUpload=fileId=>{
    const boundary='run_boundary_20260726';
    const meta={name:'running_records.json',mimeType:'application/json'};
    const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+
      '\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(datasetOut(),null,2)+'\r\n--'+boundary+'--';
    const url=(fileId?'https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(fileId):'https://www.googleapis.com/upload/drive/v3/files')
      +'?uploadType=multipart&fields=id,modifiedTime';
    return fetch(url,{method:fileId?'PATCH':'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'multipart/related; boundary='+boundary},body});
  };
  let r=await doUpload(s.jsonFileId||null);
  if(r.status===404&&s.jsonFileId){s.jsonFileId=null;saveDriveSettings(s);r=await doUpload(null);} /* 드라이브에서 파일 삭제된 경우 새로 생성 */
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(j.id&&j.id!==s.jsonFileId){s.jsonFileId=j.id;saveDriveSettings(s);}
  if(j.modifiedTime)_lastRemoteMod=j.modifiedTime; /* 내 업로드를 원격 변경으로 재수신하지 않도록 */
  return j;
}
async function backupToDrive(){
  if(!driveCreds()){openDriveSetup();return;}
  try{
    await uploadDataset();
    _pendingBackup=false;setPill();
    toast('드라이브에 정본을 저장했습니다 ('+state.records.length+'건)');
  }catch(e){toast('드라이브 백업 실패: '+((e&&e.message)||e));}
}

/* ---- 자동 동기화: 연결 시 복원·병합 + 저장 시 자동 백업(디바운스) + 60초 폴링 (설계: drive.html v2) ---- */
let _syncTimer=null,_pendingBackup=false,_syncBusy=false,_lastRemoteMod=null,_bootDone=false;
function tokenAlive(){return !!_gisToken&&Date.now()<_gisTokenExp-60000;}
function driveConnected(){return !!driveSettings().connected&&!!driveCreds();}
async function connectDrive(){ /* 사용자 제스처에서 호출 — 최초 1회 동의 팝업 */
  if(!driveCreds()){openDriveSetup();return;}
  _tokenSnooze=0;
  try{
    const token=await driveToken();
    const s=driveSettings();s.connected=true;
    try{const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+token}});
      if(r.ok)s.connectedEmail=(await r.json()).email||s.connectedEmail||null;}catch(e){}
    saveDriveSettings(s);
    toast('구글 계정이 연결되었습니다'+(s.connectedEmail?' · '+s.connectedEmail:''));
    setPill();if(current==='data')renderData();
    await syncFromDrive(true);
  }catch(e){toast('연결 실패: '+((e&&e.message)||e));}
}
function disconnectDrive(){
  const s=driveSettings();
  if(_gisToken){try{google.accounts.oauth2.revoke(_gisToken,()=>{});}catch(e){}}
  _gisToken=null;_gisTokenExp=0;_tokenClient=null;_pendingBackup=false;
  s.connected=false;delete s.connectedEmail;saveDriveSettings(s); /* jsonFileId는 유지 — 재연결 시 같은 정본 사용 */
  toast('구글 계정 연결을 해제했습니다');setPill();if(current==='data')renderData();
}
function scheduleAutoBackup(){ /* 저장 직후 3초 디바운스 — 드라이브 큐 연속 저장을 1회 업로드로 합침 */
  if(!_bootDone||!driveConnected())return;
  _pendingBackup=true;setPill();
  clearTimeout(_syncTimer);_syncTimer=setTimeout(runAutoBackup,3000);
}
async function runAutoBackup(){
  if(!driveConnected()||!_pendingBackup)return;
  if(!tokenAlive()){setPill();return;} /* 토큰 만료 — 팝업 없이 보류, 다음 제스처·폴링에서 */
  try{await uploadDataset();_pendingBackup=false;}catch(e){}
  setPill();
}
async function syncFromDrive(force){ /* 원격 정본과 병합 — force는 제스처 문맥(토큰 재발급 허용) */
  if(_syncBusy||!driveConnected())return;
  if(!force&&!tokenAlive())return;
  _syncBusy=true;
  try{
    const token=await driveToken();
    const s=driveSettings();
    let fileId=s.jsonFileId||null,mod=null;
    if(fileId){
      const r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(fileId)+'?fields=id,modifiedTime',{headers:{Authorization:'Bearer '+token}});
      if(r.ok)mod=(await r.json()).modifiedTime||null;
      else if(r.status===404){fileId=null;s.jsonFileId=null;saveDriveSettings(s);}
    }
    if(!fileId){ /* 다른 기기가 만든 정본 검색 — drive.file 스코프에는 이 앱의 파일만 보임 */
      const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent("name='running_records.json' and trashed=false")+'&fields=files(id,modifiedTime)&orderBy=modifiedTime desc&pageSize=1',{headers:{Authorization:'Bearer '+token}});
      if(r.ok){const f=((await r.json()).files||[])[0];if(f){fileId=f.id;mod=f.modifiedTime||null;s.jsonFileId=fileId;saveDriveSettings(s);}}
    }
    if(!fileId){if(state.records.length){_pendingBackup=true;await runAutoBackup();}return;} /* 원격 정본 없음 → 첫 백업 생성 */
    if(!force&&mod&&mod===_lastRemoteMod)return; /* 변경 없음 */
    const r2=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(fileId)+'?alt=media',{headers:{Authorization:'Bearer '+token}});
    if(!r2.ok)throw new Error('HTTP '+r2.status);
    const j=await r2.json();
    _lastRemoteMod=mod;
    mergeRemote(j);
  }catch(e){/* 조용히 실패 — 다음 폴링·제스처에서 재시도 */}
  finally{_syncBusy=false;setPill();}
}
function mergeRemote(j){ /* record_id 합집합 병합 + 삭제 표 반영 — 같은 id 충돌은 updated_at 최신 우선(없으면 로컬 유지) */
  const remote=normalizeRecords(Array.isArray(j&&j.records)?j.records:[]);
  (Array.isArray(j&&j.deleted_ids)?j.deleted_ids:[]).forEach(id=>{id=String(id);if(!state.deletedIds.includes(id))state.deletedIds.push(id);});
  const dead=new Set(state.deletedIds);
  const gone=state.records.filter(r=>dead.has(r.record_id)); /* 다른 기기에서 삭제된 기록 */
  gone.forEach(r=>{revokeImg(r.record_id);imgDel(r.record_id).catch(()=>{});});
  state.records=state.records.filter(r=>!dead.has(r.record_id));
  const byId=new Map(state.records.map(r=>[r.record_id,r]));
  let updated=0; /* 다른 기기에서 수정된 기록 — 더 최근 수정본 채택 */
  remote.forEach(r=>{const loc=byId.get(r.record_id);
    if(loc&&r.updated_at&&(!loc.updated_at||r.updated_at>loc.updated_at)){Object.assign(loc,r);updated++;}});
  const localSrc=new Set(state.records.map(r=>r.source_file_id).filter(Boolean));
  const fresh=remote.filter(r=>!dead.has(r.record_id)&&!byId.has(r.record_id)&&!(r.source_file_id&&localSrc.has(r.source_file_id)));
  fresh.forEach(r=>state.records.push(r));
  if(j&&j.goals&&j.goals.updated_at&&(!state.goals.updated_at||j.goals.updated_at>state.goals.updated_at)){
    const g=sanitizeGoals(j.goals);g.updated_at=j.goals.updated_at;state.goals=g;saveGoals(); /* 더 최근에 수정된 목표 채택 */
  }
  if(fresh.length||gone.length||updated){
    state.records.sort((a,b)=>a.date<b.date?-1:1);
    saveDeleted();saveRecords();setPill();
    if(current!=='add')views[current](); /* 입력 중인 폼은 건드리지 않음 */
    const parts=[];if(fresh.length)parts.push('+'+fresh.length+'건');if(updated)parts.push('갱신 '+updated+'건');if(gone.length)parts.push('−'+gone.length+'건');
    toast('드라이브 동기화 '+parts.join(' · '));
  }else{
    const rById=new Map(remote.map(r=>[r.record_id,r]));
    const localOnly=state.records.some(r=>{const rr=rById.get(r.record_id);
      return !rr||(r.updated_at&&(!rr.updated_at||r.updated_at>rr.updated_at));}); /* 로컬 신규·로컬이 더 최근 수정 */
    if(localOnly||state.deletedIds.some(id=>rById.has(id)))scheduleAutoBackup(); /* 로컬에만 있는 변경 → 업로드 */
  }
}
async function resyncNow(){ /* 수동 동기화 — 사용자 제스처라 토큰 재발급 가능 */
  if(!driveConnected()){show('data');return;}
  _tokenSnooze=0;
  try{
    await syncFromDrive(true);
    if(_pendingBackup)await runAutoBackup();
    toast('동기화 완료 · '+state.records.length+'건');
  }catch(e){toast('동기화 실패: '+((e&&e.message)||e));}
}
document.addEventListener('pointerdown',()=>{ /* 토큰 재확보는 사용자 제스처에서만(팝업 차단 회피) — 유효하면 no-op */
  if(!driveConnected()||tokenAlive()||_syncBusy||Date.now()<_tokenSnooze)return;
  driveToken().then(()=>{if(_pendingBackup)runAutoBackup();syncFromDrive(true);}).catch(()=>{setPill();});
},true);
setInterval(()=>{ /* 60초 폴링 — 유효 토큰이 있을 때만, 팝업 없이 */
  if(!driveConnected()||!tokenAlive())return;
  if(_pendingBackup)runAutoBackup();else syncFromDrive();
},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&driveConnected()&&tokenAlive())syncFromDrive();});

/* ============ 네이버 블로그 글감 (반자동 발행 — 설계는 blog.html) ============ */
const BLOG_SETTINGS_KEY='run.blog.v1'; // {blogId, categoryNo, autoOpen} — 이 브라우저에만 저장
function blogSettings(){try{return JSON.parse(localStorage.getItem(BLOG_SETTINGS_KEY))||{};}catch(e){return {};}}
function saveBlogSettings(s){try{localStorage.setItem(BLOG_SETTINGS_KEY,JSON.stringify(s));}catch(e){toast('설정 저장 실패');}}
function blogTitle(rec){return rec.date.slice(2).replace(/-/g,'.')+' - '+(Math.round((rec.distance_km||0)*10)/10).toFixed(1)+'KM';}
function naverWriteUrl(){const s=blogSettings();if(!s.blogId)return null;

/* ============ 추출 엔진 ============ */
function calcConsistency(r){
  if(r.distance_km&&r.avg_pace_sec_per_km&&!r.duration_sec) r.duration_sec=Math.round(r.distance_km*r.avg_pace_sec_per_km);
  if(r.distance_km&&r.duration_sec&&!r.avg_pace_sec_per_km) r.avg_pace_sec_per_km=Math.round(r.duration_sec/r.distance_km);
  return r;
}
function paceTimeMismatch(dist,pace,dur){ /* 거리×페이스 ≈ 시간 — 60초/7% 초과 어긋나면 true */
  if(!(dist>0)||!pace||!dur)return false;
  return Math.abs(dist*pace-dur)>Math.max(60,dur*0.07);
}
/* ---- 날짜 앵커: 캡쳐를 며칠 뒤 가져와도 러닝 날짜를 정확히 — 파일명 → EXIF → 드라이브 저장일 (planning/nrc-capture-flow.html §3) ---- */
function parseNameStamp(name){ /* 캡쳐 파일명의 타임스탬프 (Screenshot_20260726_081712 · Screenshot_2026-07-26-08-17-12 등) */
  const m=String(name||'').match(/(?:^|\D)(20\d{2})[-_.]?([01]\d)[-_.]?([0-3]\d)(?:\D{0,3}([0-2]\d)[-_.h시:]?([0-5]\d))?/);
  if(!m)return null;
  const date=m[1]+'-'+m[2]+'-'+m[3];
  const dt=new Date(date+'T00:00:00');
  if(isNaN(dt)||dt.getDate()!==+m[3]||+m[2]<1||+m[2]>12)return null; /* 2월 31일 등 배제 */
  return {date,time:m[4]?m[4]+':'+m[5]:null};
}
function buildAnchor(name,meta,fileMs){ /* 우선순위: 파일명 → EXIF 촬영시각 → 드라이브 저장일 → 파일 수정일 */
  const ns=parseNameStamp(name);
  if(ns)return {date:ns.date,time:ns.time,source:'filename'};
  const ex=meta&&meta.imageMediaMetadata&&meta.imageMediaMetadata.time; /* "2026:07:26 08:17:12" */
  if(ex){const m=String(ex).match(/(20\d{2})[:\-](\d{2})[:\-](\d{2})\D+([0-2]\d):([0-5]\d)/);
    if(m)return {date:m[1]+'-'+m[2]+'-'+m[3],time:m[4]+':'+m[5],source:'exif'};}
  const d=meta&&meta.createdTime?new Date(meta.createdTime):(fileMs>0?new Date(fileMs):null);
  if(d&&!isNaN(d))return {date:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),
    time:pad(d.getHours())+':'+pad(d.getMinutes()),source:meta&&meta.createdTime?'drive':'file'};
  return null;
}
const ANCHOR_SRC={filename:'캡쳐 파일명 기준 자동 입력 — 수정 가능',exif:'촬영 정보(EXIF) 기준 자동 입력 — 수정 가능',
  drive:'드라이브 저장일 기준 자동 입력 — 러닝 날짜와 다를 수 있어요',file:'파일 수정일 기준 자동 입력 — 러닝 날짜와 다를 수 있어요',
  ocr:'캡쳐 속 날짜(오늘/어제) 기준 자동 입력'};

function detectCaptureType(t){ /* NRC 캡쳐 유형: 격자 지표(케이던스·심박·고도)가 보이면 상세, 아니면 요약 (planning §5) */
  return /케이던스|심박|고도|spm|bpm/i.test(t)?'detail':'summary';
}
function parseRunningText(t,anchor){
  const r={};let m;
  const kind=detectCaptureType(t);
  /* 날짜 ① 절대 표기: '2026년 7월 20일' · '7월 20일' · '2026. 7. 20' — 연도 미표기 시 앵커/올해 기준, 미래면 전년 */
  m=t.match(/(?:(\d{4})\s*년\s*)?(\d{1,2})\s*월\s*(\d{1,2})\s*일/)||t.match(/(20\d{2})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
  if(m){
    const y=m[1]?+m[1]:(anchor&&anchor.date?+anchor.date.slice(0,4):new Date().getFullYear());
    const d=new Date(y+'-'+pad(+m[2])+'-'+pad(+m[3])+'T00:00:00');
    if(!m[1]){const ref=anchor&&anchor.date?new Date(anchor.date+'T00:00:00'):new Date();
      if(d>ref)d.setFullYear(d.getFullYear()-1);}
    if(!isNaN(d)&&d.getDate()===+m[3])r.date=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  /* 날짜 ② '오늘/어제' — 캡쳐 시점(앵커) 기준으로 해석 */
  m=t.match(/(오늘|어제)\s*[-–—]?\s*(\d{1,2}:\d{2})/);
  if(m){
    if(!r.date){const dt=anchor&&anchor.date?new Date(anchor.date+'T00:00:00'):new Date();
      if(m[1]==='어제')dt.setDate(dt.getDate()-1);
      r.date=dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
    r.start_time=m[2].length===4?'0'+m[2]:m[2];
  }
  if(!r.start_time){m=t.match(/(오전|오후)\s*(\d{1,2}):(\d{2})/); /* NRC 헤더의 '오전 8:17' */
    if(m){let h=+m[2]%12;if(m[1]==='오후')h+=12;r.start_time=pad(h)+':'+m[3];}}
  m=t.match(/(\d+[.,]\d+)\s*(?:킬로미터|km|㎞)/i)||t.match(/(?:킬로미터|km|거리)[^\d]{0,8}(\d+[.,]\d+)/i);
  if(m)r.distance_km=parseFloat(m[1].replace(',','.'));
  if(!r.distance_km){m=t.match(/^\s*(\d{1,3}[.,]\d{1,2})\s*$/m);if(m)r.distance_km=parseFloat(m[1].replace(',','.'));} /* NRC 대형 숫자: 라벨 없이 단독 라인 */
  m=t.match(/(\d+)\s*['′’]\s*(\d{1,2})/); if(m)r.avg_pace_sec_per_km=+m[1]*60+ +m[2];
  m=t.match(/(\d{1,2}:\d{2}(?::\d{2})?)\s*\n?\s*시간/);
  if(m)r.duration_sec=parseClock(m[1]);
  else if(kind==='summary'){ /* 상세 캡쳐는 구간·심박존 등 시계형 토큰이 많아 오인 위험 → '시간' 라벨 없으면 비움 */
    const all=[...t.matchAll(/\d{1,2}:\d{2}(?::\d{2})?/g)].map(x=>x[0])
      .filter(x=>(x.length===4?'0'+x:x)!==r.start_time); /* 시작 시각을 시간으로 오인 방지 */
    if(all.length)r.duration_sec=parseClock(all[all.length-1]);
  }
  m=t.match(/(\d{2,3})\s*\n?\s*(?:spm|케이던스)/i); if(m)r.cadence_spm=+m[1];
  m=t.match(/(\d{2,3})\s*\n?\s*(?:bpm|(?:평균\s*)?심박)/i); if(m)r.avg_heart_rate_bpm=+m[1];
  m=t.match(/(\d+(?:[.,]\d+)?)\s*m\s*\n?\s*고도/)||t.match(/고도\s*상승?\s*[^\d]{0,6}(\d+)/);
  if(m)r.elevation_gain_m=Math.round(parseFloat(String(m[1]).replace(',','.')));
  if(r.elevation_gain_m==null){m=t.match(/(?:^|\s)(\d{1,4})\s*m(?:\s|$)/m);if(m)r.elevation_gain_m=+m[1];} /* 라벨 유실 시 'N m' 단독 표기 */
  m=t.match(/[가-힣A-Za-z ]{0,14}러닝/); if(m)r.title=m[0].trim();
  m=t.match(/[가-힣]+(?:특별시|광역시|특별자치시|특별자치도)(?:\s*,\s*[가-힣]+)?/); if(m)r.location=m[0].replace(/\s*,\s*/,', ');
  return r;
}
let _tessP=null;
function loadTesseract(){
  if(window.Tesseract)return Promise.resolve();
  if(!_tessP){_tessP=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.async=true;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s);});
    _tessP.catch(()=>{_tessP=null;});}
  return _tessP;
}
async function runOCR(file,anchor,cb){
  try{await loadTesseract();}
  catch(e){cb(null,'OCR 엔진(Tesseract.js)을 불러오지 못했습니다 — 네트워크가 없거나 차단된 환경입니다.');return;}
  try{const {data}=await Tesseract.recognize(file,'kor+eng');cb(parseRunningText(data.text,anchor),null,data.text);}
  catch(e){cb(null,'인식 실패: '+e.message);}
}

/* ============ 집계 ============ */
function agg(){
  const r=state.records;
  const tot=r.reduce((a,x)=>({d:a.d+(x.distance_km||0),t:a.t+(x.duration_sec||0)}),{d:0,t:0});
  const paced=r.filter(x=>x.avg_pace_sec_per_km&&x.distance_km);
  const pd=paced.reduce((a,x)=>a+x.distance_km,0);
  const avgPace=pd?paced.reduce((a,x)=>a+x.avg_pace_sec_per_km*x.distance_km,0)/pd:null;
  const longest=r.reduce((m,x)=>(x.distance_km>(m?.distance_km||0)?x:m),null);
  const fastest=r.filter(x=>x.avg_pace_sec_per_km).reduce((m,x)=>(x.avg_pace_sec_per_km<(m?.avg_pace_sec_per_km||1e9)?x:m),null);
  return {n:r.length,...tot,avgPace,longest,fastest};
}
function periodTotals(keyFn,key){
  let dist=0,runs=0;
  state.records.forEach(x=>{if(x.date&&keyFn(x.date)===key){dist+=x.distance_km||0;runs++;}});
  return {dist,runs};
}
function goalProgress(){
  const t=todayISO();
  return {weekly:periodTotals(isoWeekKey,isoWeekKey(t)), monthly:periodTotals(monthKey,monthKey(t)), yearly:periodTotals(yearKey,yearKey(t))};
}
function goalBarHTML(label,actual,beta,alpha,unit){ /* 2중 게이지 — 채움=현재 · 눈금=β(계획) · 전체=α(목표) */
  if(!beta&&!alpha)return '';
  const max=alpha||beta;
  const okB=!!beta&&actual>=beta, okA=!!alpha&&actual>=alpha; /* 달성 판정은 반올림 전 원값 기준 */
  const pct=Math.min(100,Math.round(actual/max*100));
  const mark=beta&&alpha&&alpha>beta?Math.min(99,Math.round(beta/alpha*100)):null;
  const at=unit==='km'?(Math.round(actual*100)/100):actual;
  return `<div class="goal-row"><div class="goal-top"><span>${label}</span>
    <b>${at}${unit} <span class="bB">계획 ${beta??'—'}${okB?'✓':''}</span> <span class="bA">목표 ${alpha??'—'}${okA?'✓':''}</span></b></div>
    <div class="gbar" style="position:relative">
      ${mark?`<span style="position:absolute;left:${mark}%;top:-2px;height:12px;width:2px;background:var(--guide-beta);border-radius:1px"></span>`:''}
      <div class="gfill${okB?' done':''}" style="width:${okA?100:Math.min(pct,99)}%"></div></div></div>`;
}
function goalCard(title,gp,gt,prog){
  const bars=goalBarHTML('횟수',prog.runs,gp.runs,gt.runs,'회')+goalBarHTML('거리',prog.dist,gp.distance_km,gt.distance_km,'km');
  return `<div class="card"><p class="goal-h">${title}</p>${bars||'<div class="goal-row" style="color:var(--muted);font-size:12.5px">기준 미설정 — <a href="#" onclick="show(\'goals\');return false">설정하기 →</a></div>'}</div>`;
}
function paceStatus(){ /* 페이스 현재값 — 안정: 최근 5회(3km 이상) 평균 · 기록: 전체 최고 */
  const withPace=state.records.filter(r=>r.avg_pace_sec_per_km&&(r.distance_km||0)>=3);
  const recent=withPace.slice(-5);
  return {stable:recent.length?Math.round(recent.reduce((a,x)=>a+x.avg_pace_sec_per_km,0)/recent.length):null,
    best:withPace.length?Math.min(...withPace.map(x=>x.avg_pace_sec_per_km)):null, n:recent.length};
}
function paceLine(label,cur,beta,alpha){
  const chk=v=>cur&&v&&cur<=v?'✓':'';
  return `<div class="goal-row"><div class="goal-top"><span>${label}</span>
    <b>${cur?paceTxt(cur):'—'} <span class="bB">계획 ${beta?paceTxt(beta):'—'}${chk(beta)}</span> <span class="bA">목표 ${alpha?paceTxt(alpha):'—'}${chk(alpha)}</span></b></div></div>`;
}
function paceCard(){
  const g=state.goals,ps=paceStatus();
  return `<div class="card"><p style="margin:0 0 6px;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--muted)">페이스 <span style="font-weight:400;letter-spacing:0">/km · 낮을수록 달성</span></p>
    ${paceLine('안정 · 3km↑ 최근 '+(ps.n||0)+'회',ps.stable,g.plan.pace_stable,g.target.pace_stable)}

}

/* ---- 동기부여 대시보드 (planning/dashboard-motivation.html) — 링 게이지 · 넛지 · 스트릭 · 누적 진도 ---- */
function startPoint(){ /* 계획 시작점 — 설정값 > 올해 첫 기록일 > 1월 1일 */
  const y=todayISO().slice(0,4);
  const s=state.goals.start_date;
  if(s&&s.slice(0,4)===y)return s; /* 올해 범위의 설정값만 유효 */
  const first=state.records.map(r=>r.date).filter(d=>d&&d.slice(0,4)===y).sort()[0];
  return first||y+'-01-01';
}
function yearFraction(){ /* 시작점~연말이 한 해에서 차지하는 비율 (1월 시작이면 1) */
  const y=+todayISO().slice(0,4);
  const s0=new Date(startPoint()+'T00:00:00'),yStart=new Date(y,0,1),yEnd=new Date(y+1,0,1);
  const total=Math.round((yEnd-yStart)/86400000);
  const remain=Math.max(1,Math.round((yEnd-(s0>yStart?s0:yStart))/86400000));
  return Math.min(1,remain/total);
}
function proratedYearly(tier){ /* 연간 기준을 시작점 기준으로 환산 */
  const f=yearFraction(),r=v=>v?Math.round(v*f):v;
  return {runs:r(tier.runs),distance_km:r(tier.distance_km)};
}
function startCaption(){ /* 환산 중일 때만 표시 */
  if(yearFraction()>=0.999)return '';
  const sp=startPoint(),g=state.goals;
  return `<div style="font-size:11px;color:var(--muted);margin-top:6px">시작 ${+sp.slice(5,7)}/${+sp.slice(8,10)} 기준 환산 · 연간 원기준 계획 ${g.plan.yearly.runs??'—'} · 목표 ${g.target.yearly.runs??'—'}회</div>`;
}
function ringSVG(actual,beta,alpha){ /* 횟수 링 — 채움=현재/α · β 위치 눈금 */
  const R=34,C=2*Math.PI*R,max=alpha||beta||1;
  const frac=Math.min(1,(actual||0)/max);
  const okB=!!beta&&actual>=beta;
  let tick='';
  if(beta&&alpha&&beta<alpha){const a=(-90+360*beta/alpha)*Math.PI/180;
    tick=`<line x1="${(44+(R-7)*Math.cos(a)).toFixed(1)}" y1="${(44+(R-7)*Math.sin(a)).toFixed(1)}" x2="${(44+(R+7)*Math.cos(a)).toFixed(1)}" y2="${(44+(R+7)*Math.sin(a)).toFixed(1)}" stroke="var(--guide-beta)" stroke-width="2.5" stroke-linecap="round"/>`;}
  return `<svg viewBox="0 0 88 88" width="94" height="94" style="display:block;flex:none">
    <title>횟수 ${actual} · 계획 ${beta??'—'} · 목표 ${alpha??'—'}</title>
    <circle cx="44" cy="44" r="${R}" fill="none" stroke="var(--grid)" stroke-width="8"/>
    ${frac>0?`<circle cx="44" cy="44" r="${R}" fill="none" stroke="${okB?'var(--good)':'var(--series-1)'}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(C*frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 44 44)"/>`:''}
    ${tick}
    <text x="44" y="42" text-anchor="middle" style="font-size:20px;font-weight:750;fill:var(--text-primary)">${actual}</text>
    <text x="44" y="57" text-anchor="middle" style="font-size:9px;font-weight:700;fill:${alpha?'var(--guide-alpha)':(beta?'var(--guide-beta)':'var(--muted)')}">/ ${alpha?'목표 '+alpha:(beta?'계획 '+beta:'—')}회</text>
  </svg>`;
}
function goalNudge(actual,beta,alpha,unit,dec){ /* 남은 양 넛지 — 달성 욕구의 트리거 */
  const fmt=v=>dec?(Math.round(v*10)/10):Math.ceil(v);
  if(alpha&&actual>=alpha)return '<b style="color:var(--good-text)">🎉 목표 달성!</b>';
  if(beta&&actual>=beta)return '<b style="color:var(--good-text)">계획 달성 ✓</b>'+(alpha?' <span class="bA" style="font-weight:600">목표까지 '+fmt(alpha-actual)+unit+'</span>':'');
  if(beta)return '<b class="bB">계획까지 '+fmt(beta-actual)+unit+' 남음</b>';
  if(alpha)return '<span class="bA">목표까지 '+fmt(alpha-actual)+unit+'</span>';
  return '';
}
function ringCard(title,gp,gt,prog,extra){
  const okB=!!gp.runs&&prog.runs>=gp.runs; /* 계획 달성 카드는 좌측 초록 라인으로 상태 표시 */
  return `<div class="card" style="display:flex;gap:14px;align-items:center${okB?';border-left:3px solid var(--good)':''}">
    ${ringSVG(prog.runs,gp.runs,gt.runs)}
    <div style="flex:1;min-width:0">
      <p style="margin:0;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--muted)">${title}</p>
      <div style="font-size:13px;margin:3px 0 9px">${goalNudge(prog.runs,gp.runs,gt.runs,'회')}</div>
      ${goalBarHTML('거리',prog.dist,gp.distance_km,gt.distance_km,'km')}
      ${extra||''}
    </div></div>`;
}
function weekDotsHTML(){ /* 이번 주 월~일 러닝 도트 */
  const wk=isoWeekKey(todayISO());
  const set=new Set(state.records.filter(r=>r.date&&isoWeekKey(r.date)===wk)
    .map(r=>(new Date(r.date+'T00:00:00').getDay()+6)%7));
  return `<div style="display:flex;gap:5px;margin-top:9px">${['월','화','수','목','금','토','일'].map((n,i)=>
    `<span title="${n}요일" style="width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:9px;${set.has(i)?'background:var(--series-1);color:#fff;font-weight:700':'background:var(--grid);color:var(--muted)'}">${n}</span>`).join('')}</div>`;
}
function betaStreak(){ /* β(주간 횟수) 연속 달성 주 수 — 이번 주는 달성 시에만 포함 */
  const b=state.goals.plan.weekly.runs;if(!b)return 0;
  const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const met=k=>periodTotals(isoWeekKey,k).runs>=b;
  let streak=0;const d=new Date(isoWeekKey(todayISO())+'T00:00:00');
  if(met(key(d)))streak++;
  d.setDate(d.getDate()-7);
  while(met(key(d))&&streak<520){streak++;d.setDate(d.getDate()-7);}
  return streak;
}
function streakHTML(){const n=betaStreak();return n?`<div style="font-size:12px;margin-top:7px">🔥 <b>계획 연속 ${n}주</b> 달성 중</div>`:'';}
function drawHeatmap(){ /* 꾸준함 잔디 — 최근 20주 요일×주 격자, 거리 농도(단일 색상 명암) · 벤치마킹: Runalyze·Smashrun 캘린더 히트맵 */
  const el=$('#ch-heat');if(!el)return;
  const weeks=20,cell=12,gap=3,left=26,top=16;
  const byDate={};state.records.forEach(r=>{if(r.date)byDate[r.date]=(byDate[r.date]||0)+(r.distance_km||0);});
  const today=todayISO();
  const monday=new Date(isoWeekKey(today)+'T00:00:00');
  let s='';
  ['월','','수','','금','','일'].forEach((n,i)=>{if(n)s+=`<text class="tick" x="${left-6}" y="${top+i*(cell+gap)+cell-2}" text-anchor="end">${n}</text>`;});
  const seenMonth={};
  for(let w=0;w<weeks;w++){
    const wStart=new Date(monday);wStart.setDate(wStart.getDate()-7*(weeks-1-w));
    for(let d=0;d<7;d++){
      const day=new Date(wStart);day.setDate(day.getDate()+d);
      const key=day.getFullYear()+'-'+pad(day.getMonth()+1)+'-'+pad(day.getDate());
      if(key>today)continue;
      const v=byDate[key]||0;
      const fill=v?(v>=6?'var(--seq-550)':(v>=3?'var(--series-1)':'var(--series-1-soft)')):'var(--grid)';
      const x=left+w*(cell+gap),yy=top+d*(cell+gap);
      s+=`<rect x="${x}" y="${yy}" width="${cell}" height="${cell}" rx="3" fill="${fill}"${key===today?' stroke="var(--text-primary)" stroke-width="1.5"':''} data-t="${key}${v?' · <b>'+v.toFixed(1)+'km</b>':' · 휴식'}"/>`;
      if(d===0&&day.getDate()<=7&&!seenMonth[day.getMonth()]){seenMonth[day.getMonth()]=1;
        s+=`<text class="tick" x="${x}" y="${top-5}">${day.getMonth()+1}월</text>`;}
    }
  }
  const W=left+weeks*(cell+gap)+8,H=top+7*(cell+gap)+4;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block">${s}</svg>`;
  bindHover(el);
  const sEl=$('#heatSummary');
  if(sEl){ /* 카드 하단 요약 — 기간 내 러닝일 수와 주평균 */
    const from=new Date(monday);from.setDate(from.getDate()-7*(weeks-1));
    const fromKey=from.getFullYear()+'-'+pad(from.getMonth()+1)+'-'+pad(from.getDate());
    const runDays=Object.keys(byDate).filter(k=>k>=fromKey&&k<=today&&byDate[k]>0).length;
    sEl.innerHTML=runDays?`최근 ${weeks}주 동안 <b>${runDays}일</b> 달렸어요 · 주평균 <b>${(runDays/weeks).toFixed(1)}일</b>`
      :'아직 이 기간의 기록이 없어요 — 오늘 한 칸을 채워볼까요?';
  }
}
function drawCumulative(){ /* 올해 누적 거리 vs β·α 페이스라인 — 시작점 기준 (기준선은 연간값의 시작일 환산) */
  const el=$('#ch-cum');if(!el)return;
  const y=+todayISO().slice(0,4),g=state.goals;
  const sp=startPoint();
  const yStart=new Date(y,0,1),yEnd=new Date(y+1,0,1);
  const spD=new Date(sp+'T00:00:00'),s0=spD>yStart?spD:yStart;
  const totalDays=Math.round((yEnd-yStart)/86400000);
  const remainDays=Math.max(1,Math.round((yEnd-s0)/86400000));
  const f=remainDays/totalDays;
  const bY=g.plan.yearly.distance_km?Math.round(g.plan.yearly.distance_km*f):null;
  const aY=g.target.yearly.distance_km?Math.round(g.target.yearly.distance_km*f):null;
  const sM=s0.getMonth()+1,nowM=new Date().getMonth()+1;
  const per=Array(12).fill(0);
  state.records.forEach(r=>{if(r.date&&+r.date.slice(0,4)===y&&r.date>=sp)per[+r.date.slice(5,7)-1]+=r.distance_km||0;});
  let acc=0;const cum=[];
  for(let m=sM;m<=nowM;m++){acc+=per[m-1];cum.push({m,v:Math.round(acc*100)/100});}
  const nEl=$('#cumNudge');
  if(nEl&&bY){ /* 시작점 이후 경과일 기준 β 진도선 대비 */
    const elapsed=Math.max(1,Math.round((new Date(todayISO()+'T00:00:00')-s0)/86400000)+1);
    const d=acc-bY*Math.min(1,elapsed/remainDays);
    nEl.innerHTML=d>=0?`<b style="color:var(--good-text)">지금 계획 페이스보다 ${d.toFixed(1)}km 앞서 있어요 🔥</b>`
      :`<b style="color:var(--guide-beta)">계획 페이스까지 ${(-d).toFixed(1)}km — 따라잡아요!</b>`;
  }
  const sEl=$('#cumStart');
  if(sEl)sEl.textContent=f<0.999?`· 시작 ${+sp.slice(5,7)}/${+sp.slice(8,10)} — 기준선은 연간 계획·목표의 시작일 환산`:'';
  const W=el.clientWidth||940,H=225,P={t:16,r:64,b:24,l:40};
  const iw=W-P.l-P.r,ih=H-P.t-P.b;
  const maxV=Math.max(aY||0,bY||0,acc,1)*1.05;
  const xd=d=>P.l+iw*Math.min(1,Math.max(0,(d-s0)/(yEnd-s0)));
  const yv=v=>P.t+ih-(v/maxV)*ih;
  let s='';
  [0,maxV/2,maxV].forEach(t=>{const yy=yv(t);s+=`<line class="gridline" x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}"/><text class="tick" x="${P.l-5}" y="${yy+3}" text-anchor="end">${Math.round(t)}</text>`;});
  const mStep=(12-sM+1)>8?2:1;
  for(let m=sM;m<=12;m+=mStep)s+=`<text class="tick" x="${xd(new Date(y,m-1,15)).toFixed(1)}" y="${H-7}" text-anchor="middle">${m}월</text>`;
  const guide=(v,c,lb)=>v?`<line x1="${P.l}" y1="${yv(0)}" x2="${(P.l+iw).toFixed(1)}" y2="${yv(v)}" stroke="${c}" stroke-width="2" stroke-dasharray="6 5"/><text x="${(P.l+iw+4).toFixed(1)}" y="${yv(v)+3}" style="font-size:10px;font-weight:700;fill:${c}">${lb}</text>`:'';
  s+=guide(aY,'var(--guide-alpha)','목표 '+aY)+guide(bY,'var(--guide-beta)','계획 '+bY);
  const today=new Date(todayISO()+'T00:00:00');
  const pts=cum.map(e=>[xd(e.m===nowM?today:new Date(y,e.m,0)),yv(e.v),e]);
  if(pts.length){
    s+=`<path class="area" d="M${P.l} ${yv(0)} ${pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')} L${pts.at(-1)[0].toFixed(1)} ${yv(0)} Z"/>`;
    s+=`<path class="linepath" style="stroke-width:2.5" d="M${P.l} ${yv(0)} ${pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}"/>`;
    s+=pts.map(p=>`<circle class="dot-m" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5"/><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="11" fill="transparent" data-t="${p[2].m}월 · 누적 <b>${p[2].v.toFixed(1)}km</b>"/>`).join('');
    s+=`<text x="${pts.at(-1)[0].toFixed(1)}" y="${(pts.at(-1)[1]-9).toFixed(1)}" text-anchor="middle" style="font-size:10.5px;font-weight:750;fill:var(--series-1)">${acc.toFixed(0)}km</text>`;
  }
  el.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}">${s}<line class="baseline" x1="${P.l}" y1="${P.t+ih}" x2="${W-P.r}" y2="${P.t+ih}"/></svg>`;
  bindHover(el);
}

let _prevUrl=null,_autoDate=null,_autoTime=null;
function handleFile(f){
  if(!f.type||!f.type.startsWith('image/')){toast('이미지 파일만 업로드할 수 있습니다');return;}
  if(!state.pendingDrive)state.pendingAnchor=buildAnchor(f.name,null,f.lastModified); /* 로컬 업로드도 파일명·수정일 앵커 적용 */
  state.pendingImage=f;
  if(_prevUrl)URL.revokeObjectURL(_prevUrl);
  _prevUrl=URL.createObjectURL(f);
  $('#photoPrev').innerHTML=`<img class="imgprev" src="${_prevUrl}" alt="업로드 미리보기">`;
  $('#manualLink').classList.add('hide');
  if(!$('#f_date'))showForm({});
  /* 날짜 앵커 즉시 프리필 — OCR을 기다리지 않음. 빈 칸만 채우고 언제든 수정 가능 (planning §3) */
  _autoDate=null;_autoTime=null;
  const a=state.pendingAnchor;
  if(a&&$('#f_date')&&!$('#f_date').value){$('#f_date').value=a.date;_autoDate=a.date;setDateHint(a.source);}
  if(a&&a.time&&$('#f_time')&&!$('#f_time').value){$('#f_time').value=a.time;_autoTime=a.time;}
  updateQueueCtl();
  $('#ocrStatus').innerHTML='⏳ 이미지에서 값을 읽는 중… (최초 실행 시 OCR 엔진 로딩으로 수십 초 걸릴 수 있어요 — 기다리는 동안 직접 입력해도 됩니다)';
  runOCR(f,a,(parsed,err,raw)=>{
    /* 스테일 가드: 뷰를 떠났다 돌아온 뒤 도착한 이전 사진의 콜백 차단 */
    if(state.pendingImage!==f||current!=='add'||!$('#ocrStatus'))return;
    if(err){$('#ocrStatus').innerHTML='<span style="color:var(--warn)">'+esc(err)+'</span> 값을 직접 입력해주세요 — 사진은 저장 시 함께 보관됩니다.';return;}
    state.pendingRawOcr=raw||null;
    const p=parsed||{};
    /* 캡쳐 속 '오늘/어제'(앵커 보정됨)가 앵커 추정치보다 정확 — 사용자가 손대지 않았을 때만 교체 */
    if(p.date&&_autoDate&&$('#f_date')&&$('#f_date').value===_autoDate&&p.date!==_autoDate)$('#f_date').value='';
    if(p.start_time&&_autoTime&&$('#f_time')&&$('#f_time').value===_autoTime)$('#f_time').value='';
    applyPrefill(p);
    if(p.date&&$('#f_date')&&$('#f_date').value===p.date&&p.date!==_autoDate)setDateHint('ocr');
    const warn=validatePrefill(); /* 거리·페이스·시간 상호 검증 (planning §5) */
    $('#ocrStatus').innerHTML='✅ 인식 완료 — 값을 확인하고 필요하면 수정한 뒤 저장하세요. (빈 칸만 자동으로 채웠습니다)'+
      (warn?' <span style="color:var(--warn)">⚠ '+esc(warn)+'</span>':'');
  });
}
function validatePrefill(){ /* 프리필 의심 지점 강조 — 어긋난 칸만 손대게 */
  ['f_dist','f_pace','f_dur'].forEach(id=>{const el=$('#'+id);if(el)el.classList.remove('warn');});
  const dEl=$('#f_dist');if(!dEl)return null;
  const dist=parseFloat(dEl.value),pace=parsePace(($('#f_pace')||{value:''}).value),dur=parseClock(($('#f_dur')||{value:''}).value);
  if(!(dist>0)){dEl.classList.add('warn');return '거리를 읽지 못했습니다 — 직접 입력해주세요.';}
  if(paceTimeMismatch(dist,pace,dur)){
    ['f_dist','f_pace','f_dur'].forEach(id=>{const el=$('#'+id);if(el)el.classList.add('warn');});
    return '거리·페이스·시간이 서로 맞지 않습니다 — 강조된 칸을 확인해주세요.';
  }
  return null;
}

function applyPrefill(p){
  const setIf=(id,val)=>{const el=$('#'+id);if(el&&!el.value&&(val||val===0))el.value=val;};
  if(!$('#f_date'))showForm({});
  setIf('f_date',p.date);setIf('f_time',p.start_time);setIf('f_title',p.title);setIf('f_loc',p.location);
  setIf('f_dist',p.distance_km);setIf('f_pace',p.avg_pace_sec_per_km?paceTxt(p.avg_pace_sec_per_km):null);
  setIf('f_dur',p.duration_sec?clock(p.duration_sec):null);setIf('f_elev',p.elevation_gain_m);
  setIf('f_cad',p.cadence_spm);setIf('f_hr',p.avg_heart_rate_bpm);
}
let _saving=false;
async function saveRecord(){
  if(_saving)return; /* await imgPut 중 재클릭으로 인한 중복 저장 차단 */
  _saving=true;
  try{await _saveRecordInner();}finally{_saving=false;}
}
async function _saveRecordInner(){
  const g=id=>{const el=$('#'+id);return el?el.value.trim():'';};
  if(!g('f_date')||!g('f_dist')){toast('날짜와 거리는 필수입니다');return;}
  const d=g('f_date'),tm=g('f_time');
  const fields=calcConsistency({
    date:d, weekday:WD[new Date(d+'T00:00:00').getDay()],
    start_time:tm||null, day_part: tm? (+tm.slice(0,2)<12?'오전':'오후') : null,
    title:g('f_title')||'러닝', location:g('f_loc')||null,
    distance_km:parseFloat(g('f_dist')),
    avg_pace_sec_per_km:parsePace(g('f_pace')), duration_sec:parseClock(g('f_dur')),
    elevation_gain_m:g('f_elev')?Math.round(+g('f_elev')):null,
    cadence_spm:+g('f_cad')||null, avg_heart_rate_bpm:+g('f_hr')||null
  });
  if(!(fields.distance_km>0)){toast('거리는 0보다 큰 숫자여야 합니다');return;}
  const editing=state.editingId?state.records.find(r=>r.record_id===state.editingId):null;
  let rec;
  if(editing){rec=Object.assign(editing,fields);rec.updated_at=new Date().toISOString();} /* 수정 시각 — 동기화 병합 기준 */
  else{
    rec={record_id:'r'+Date.now(), ...fields,
      source:state.pendingDrive?'drive':(state.pendingImage?'ocr':'manual'),
      source_file_id:state.pendingDrive?state.pendingDrive.id:null,
      original_filename:state.pendingDrive?state.pendingDrive.name:null,
      has_image:false, image_url:null, raw_ocr:state.pendingRawOcr||null,
      created_at:new Date().toISOString(), updated_at:new Date().toISOString(), schema_version:'2.0'};
    state.records.push(rec);
  }
  if(state.pendingImage){
    try{await imgPut(rec.record_id,state.pendingImage);revokeImg(rec.record_id);rec.has_image=true;
      if(state.pendingRawOcr)rec.raw_ocr=state.pendingRawOcr;}
    catch(e){toast('사진 저장에 실패했습니다 — 기록만 저장됩니다');}
  }
  state.records.sort((a,b)=>a.date<b.date?-1:1);
  saveRecords();setPill();
  const wasEdit=!!editing,wasQueue=state.driveTotal>0; /* show()가 driveTotal을 초기화하므로 먼저 캡처 */
  if(wasQueue&&!wasEdit)_drvSaved++;
  state.pendingImage=null;state.pendingRawOcr=null;state.editingId=null;state.pendingDrive=null;state.pendingAnchor=null;
  if(state.batch&&state.batch.active&&state.batch.editIdx!=null&&!wasEdit){ /* 일괄 검토의 수정 저장 → 목록 복귀 */
    const bi=state.batch.items[state.batch.editIdx];
    if(bi){bi.status='saved';bi.recId=rec.record_id;}
    state.batch.editIdx=null;
    toast('저장되었습니다 · 총 '+state.records.length+'건');
    renderAdd();
    return;
  }
  toast(wasEdit?'기록이 수정되었습니다':'저장되었습니다 · 총 '+state.records.length+'건');
  if(state.driveQueue&&state.driveQueue.length){show('add');nextDriveItem();} /* 드라이브 큐 이어서 처리 */
  else{
    state.driveQueue=null;state.driveTotal=0;show('dashboard');
    const bs=blogSettings(); /* 블로그 글감 — 단건 신규 저장은 자동 오픈, 드라이브 큐는 소진 후 일괄 안내 (blog.html) */
    if(bs.blogId&&bs.autoOpen!==false){
      if(!wasEdit&&!wasQueue)openBlogDraft(rec.record_id);
      else if(wasQueue&&blogUnposted().length)openBlogQueue();
    }
  }
}

function lastWeeks(n){
  const out=[];const cur=new Date(isoWeekKey(todayISO())+'T00:00:00');
  for(let i=0;i<n;i++){out.push(cur.getFullYear()+'-'+pad(cur.getMonth()+1)+'-'+pad(cur.getDate()));cur.setDate(cur.getDate()-7);}
  return out;
}
function lastMonths(n){
  const out=[];const t=new Date();let y=t.getFullYear(),m=t.getMonth()+1;
  for(let i=0;i<n;i++){out.push(y+'-'+pad(m));m--;if(m===0){m=12;y--;}}
  return out;
}
function historyRows(keys,keyFn,gp,gt,labelFn){
  return keys.map(k=>{
    const t=periodTotals(keyFn,k);
    const cell=(actual,b,a)=>{
      if(!b&&!a)return '<td>—</td>';
      const okB=b&&actual>=b,okA=a&&actual>=a; /* 원값 비교 */
      const s=(b?'<span class="bB">계획 '+Math.round(actual/b*100)+'%'+(okB?'✓':'')+'</span>':'')+(b&&a?' · ':'')+(a?'<span class="bA">목표 '+Math.round(actual/a*100)+'%'+(okA?'✓':'')+'</span>':'');
      return `<td style="${okB?'font-weight:700':''}">${s}</td>`;};
    return `<tr><td>${labelFn(k)}</td><td>${t.runs}회</td><td>${t.dist.toFixed(1)}km</td>${cell(t.runs,gp.runs,gt.runs)}${cell(t.dist,gp.distance_km,gt.distance_km)}</tr>`;
  }).join('');
}

function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onerror=()=>{toast('파일을 읽지 못했습니다');e.target.value='';};
  rd.onload=()=>{
    try{
      const j=JSON.parse(rd.result);
      const recs=normalizeRecords(Array.isArray(j)?j:(Array.isArray(j.records)?j.records:[]));
      if(!recs.length){toast('가져올 기록이 없습니다 — 파일 형식을 확인하세요');e.target.value='';return;}
      if(!confirm('현재 기록 '+state.records.length+'건을 불러온 데이터 '+recs.length+'건으로 교체합니다. 계속할까요?')){e.target.value='';return;}
      recs.forEach(x=>{if(!x.source||x.source==='demo')x.source='import';});
      const newIds=new Set(recs.map(x=>x.record_id));
      state.records.forEach(x=>{if(!newIds.has(x.record_id)){ /* 교체로 사라지는 레코드: 사진 정리 + 삭제 표 */
        if(!state.deletedIds.includes(x.record_id))state.deletedIds.push(x.record_id);
        revokeImg(x.record_id);imgDel(x.record_id).catch(()=>{});}});
      (Array.isArray(j.deleted_ids)?j.deleted_ids:[]).forEach(id=>{id=String(id);if(!state.deletedIds.includes(id))state.deletedIds.push(id);});
      state.deletedIds=state.deletedIds.filter(id=>!newIds.has(id));saveDeleted(); /* 가져온 기록은 부활 처리 */
      state.records=recs.sort((a,b)=>a.date<b.date?-1:1);
      if(j.goals){state.goals=sanitizeGoals(j.goals);state.goals.updated_at=new Date().toISOString();saveGoals();}
      saveRecords();setPill();toast('불러왔습니다 · '+recs.length+'건');renderData();
    }catch(x){toast('JSON을 읽을 수 없습니다');}
    e.target.value='';
  };
  rd.readAsText(f);
}
function delRec(id){
  const r=state.records.find(x=>x.record_id===id);if(!r)return;
  if(!confirm((r.date||'')+' 기록을 삭제할까요?'+(driveConnected()?' 드라이브 동기화로 다른 기기에서도 삭제됩니다.':'')))return;
  state.records=state.records.filter(x=>x.record_id!==id);
  if(!state.deletedIds.includes(id))state.deletedIds.push(id);saveDeleted(); /* 삭제 표 — 동기화 시 부활 방지 */
  saveRecords();setPill();revokeImg(id);imgDel(id).catch(()=>{});
  toast('삭제됨');views[current](); /* 대시보드·데이터 어디서 지웠든 현재 화면 유지 */
}

const tip=$('#tip');
function bindHover(el){el.querySelectorAll('[data-t]').forEach(m=>{m.addEventListener('mousemove',e=>{tip.innerHTML=m.getAttribute('data-t');tip.style.opacity=1;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';});m.addEventListener('mouseleave',()=>tip.style.opacity=0);});}
function barChart(el,data,opts){
  opts=opts||{};const guides=opts.guides||[];
  if(!data.length){el.innerHTML='<div class="empty">데이터 없음</div>';return;}
  const W=el.clientWidth||460,H=200,P={t:12,r:guides.length?48:8,b:24,l:28};
  const iw=W-P.l-P.r,ih=H-P.t-P.b;
  const max=Math.max(...data.map(d=>d.v),...guides.map(x=>x.v),1)*1.12,bw=iw/data.length,bar=Math.min(30,bw*.6);
  const y=v=>P.t+ih-(v/max)*ih;let g='';
  [0,max/2,max].forEach(t=>{const yy=y(t);g+=`<line class="gridline" x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}"/><text class="tick" x="${P.l-5}" y="${yy+3}" text-anchor="end">${t.toFixed(0)}</text>`;});
  guides.forEach(x=>{const yy=y(x.v); /* β·α 기준선 — 점선 + 직접 라벨 */
    g+=`<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="${x.color}" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-P.r+3}" y="${yy+3}" style="font-size:9.5px;font-weight:700;fill:${x.color}">${x.label}</text>`;});
  data.forEach((d,i)=>{const cx=P.l+bw*i+bw/2,yy=y(d.v);
    g+=`<rect class="bar" ${i===opts.hi?'style="fill:var(--seq-550)" ':''}x="${cx-bar/2}" y="${yy}" width="${bar}" height="${Math.max(1,P.t+ih-yy)}" rx="4" data-t="${esc(d.w+' · <b>'+d.v.toFixed(1)+'km</b>')}"/><text class="tick" x="${cx}" y="${H-7}" text-anchor="middle">${esc(d.w)}</text>`;});
  el.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<line class="baseline" x1="${P.l}" y1="${P.t+ih}" x2="${W-P.r}" y2="${P.t+ih}"/></svg>`;bindHover(el);
}
function lineChart(el,data){
  if(data.length<2){el.innerHTML='<div class="empty">페이스 데이터가 2건 이상일 때 표시됩니다</div>';return;}
  const W=el.clientWidth||460,H=200,P={t:14,r:14,b:24,l:38};const iw=W-P.l-P.r,ih=H-P.t-P.b;
  const vs=data.map(d=>d.s),mn=Math.min(...vs)-6,mx=Math.max(...vs)+6;
  const x=i=>P.l+iw*i/(data.length-1),y=s=>P.t+ih-((s-mn)/(mx-mn||1))*ih;let g='';
  for(let k=0;k<=2;k++){const s=mn+(mx-mn)*k/2,yy=y(s);g+=`<line class="gridline" x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}"/><text class="tick" x="${P.l-5}" y="${yy+3}" text-anchor="end">${paceTxt(Math.round(s))}</text>`;}
  const pts=data.map((d,i)=>[x(i),y(d.s)]);
  g+=`<path class="area" d="M${pts[0][0]} ${P.t+ih} ${pts.map(p=>'L'+p[0]+' '+p[1]).join(' ')} L${pts.at(-1)[0]} ${P.t+ih} Z"/><path class="linepath" d="${pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ')}"/>`;
  data.forEach((d,i)=>{g+=`<circle class="dot-m" cx="${x(i)}" cy="${y(d.s)}" r="4"/><circle cx="${x(i)}" cy="${y(d.s)}" r="12" fill="transparent" data-t="${esc(d.d+' · <b>'+paceTxt(d.s)+'</b>')}"/><text class="tick" x="${x(i)}" y="${H-7}" text-anchor="middle">${esc(d.d)}</text>`;});
  el.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;bindHover(el);
}

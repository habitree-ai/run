<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>러닝 누적기록 · 집계 대시보드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
<style>
  :root{color-scheme:light;
    --surface-1:#fcfcfb;--plane:#f9f9f7;--text-primary:#0b0b0b;--text-secondary:#52514e;--muted:#898781;
    --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,0.10);--series-1:#2a78d6;--series-1-soft:#cde2fb;
    --seq-550:#1c5cab;--seq-700:#0d366b;--good:#0ca30c;--good-text:#006300;--warn:#b26a00;--warn-soft:#fdecc8;
    --radius:14px;--shadow:0 1px 2px rgba(11,11,11,.04),0 4px 16px rgba(11,11,11,.05);
    --font:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Consolas,monospace;}
  :root[data-theme="dark"]{color-scheme:dark;
    --surface-1:#1a1a19;--plane:#0d0d0d;--text-primary:#fff;--text-secondary:#c3c2b7;--muted:#898781;
    --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,0.10);--series-1:#3987e5;--series-1-soft:#184f95;
    --seq-550:#6da7ec;--seq-700:#b7d3f6;--good:#0ca30c;--good-text:#0ca30c;--warn:#fab219;--warn-soft:#3a2f10;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
    --surface-1:#1a1a19;--plane:#0d0d0d;--text-primary:#fff;--text-secondary:#c3c2b7;--muted:#898781;
    --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,0.10);--series-1:#3987e5;--series-1-soft:#184f95;
    --seq-550:#6da7ec;--seq-700:#b7d3f6;--good-text:#0ca30c;--warn:#fab219;--warn-soft:#3a2f10;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);}}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--plane);color:var(--text-primary);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--series-1);text-decoration:none}a:hover{text-decoration:underline}
  button{font-family:inherit}
  /* top bar */
  header.top{border-bottom:1px solid var(--border);background:var(--surface-1);position:sticky;top:0;z-index:30}
  .top-inner{display:flex;align-items:center;gap:14px;padding:11px 20px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--series-1),var(--seq-550));display:grid;place-items:center;color:#fff}
  .brand h1{font-size:15.5px;margin:0;letter-spacing:-.01em}
  .brand .sub{font-size:11.5px;color:var(--muted)}
  .draft-badge{font-size:10.5px;font-weight:700;color:#fff;background:var(--series-1);padding:2px 8px;border-radius:999px;margin-left:2px}
  .spacer{flex:1}
  .storage-pill{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-secondary);
    border:1px solid var(--border);border-radius:999px;padding:4px 11px;background:var(--plane)}
  .storage-pill .d{width:8px;height:8px;border-radius:50%;background:var(--warn)}
  .storage-pill.connected .d{background:var(--good)}
  .docnav{display:flex;gap:2px}
  .docnav a{padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-secondary)}
  .docnav a.active{background:var(--series-1-soft);color:var(--seq-700)}
  :root[data-theme="dark"] .docnav a.active{color:#fff}
  .toggle{border:1px solid var(--border);background:transparent;color:var(--text-secondary);width:34px;height:34px;border-radius:9px;cursor:pointer;display:grid;place-items:center}
  .toggle:hover{background:var(--plane)}
  /* layout */
  .shell{display:grid;grid-template-columns:210px 1fr;gap:0;min-height:calc(100vh - 58px)}
  @media(max-width:820px){.shell{grid-template-columns:1fr}}
  nav.rail{border-right:1px solid var(--border);background:var(--surface-1);padding:16px 12px}
  @media(max-width:820px){nav.rail{border-right:none;border-bottom:1px solid var(--border);display:flex;gap:6px;overflow:auto}}
  nav.rail button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:transparent;
    color:var(--text-secondary);font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
  nav.rail button:hover{background:var(--plane)}
  nav.rail button.active{background:var(--series-1-soft);color:var(--seq-700)}
  :root[data-theme="dark"] nav.rail button.active{color:#fff}
  nav.rail button svg{width:17px;height:17px;flex:none}
  nav.rail .rail-h{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 12px;margin-top:8px}
  main.stage{padding:24px 26px 60px;max-width:1000px;min-width:0}
  h2.vh{font-size:20px;letter-spacing:-.01em;margin:0 0 4px}
  .vsub{color:var(--muted);font-size:13px;margin:0 0 20px}
  /* cards / kpi */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
  .kpi .label{font-size:12px;color:var(--text-secondary)}
  .kpi .val{font-size:26px;font-weight:750;letter-spacing:-.02em;margin-top:6px;line-height:1.05}
  .kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
  .kpi .foot{font-size:11px;color:var(--muted);margin-top:4px}
  /* backends */
  .backends{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:6px}
  .be{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
  .be .be-h{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
  .be .be-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--series-1-soft);color:var(--seq-700)}
  :root[data-theme="dark"] .be .be-ic{color:#dbe9ff}
  .be p{font-size:12.5px;color:var(--text-secondary);margin:0;flex:1;line-height:1.5}
  .be .tag{align-self:flex-start;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px}
  .tag.rec{background:var(--good);color:#fff}
  .tag.soon{background:var(--warn-soft);color:var(--warn)}
  .btn{border:1px solid var(--series-1);background:var(--series-1);color:#fff;font-weight:600;font-size:13px;
    padding:9px 14px;border-radius:10px;cursor:pointer;transition:opacity .12s}
  .btn:hover{opacity:.9}
  .btn.ghost{background:transparent;color:var(--series-1)}
  .btn.sec{background:transparent;color:var(--text-secondary);border-color:var(--border)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:6px 11px;font-size:12px}
  label.btn{display:inline-block}
  /* forms */
  .form{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);max-width:640px}
  .fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.fg{grid-template-columns:1fr}}
  .field label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:5px;font-weight:600}
  .field input,.field select{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13.5px;
    background:var(--plane);color:var(--text-primary);font-family:inherit}
  .field input:focus,.field select:focus{outline:2px solid var(--series-1-soft);border-color:var(--series-1)}
  .field .hint{font-size:11px;color:var(--muted);margin-top:3px}
  .form-actions{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
  .note{font-size:12.5px;color:var(--text-secondary);background:var(--series-1-soft);border-radius:10px;padding:11px 13px;line-height:1.5}
  :root[data-theme="dark"] .note{background:rgba(57,135,229,.12)}
  .note.warn{background:var(--warn-soft);color:var(--warn)}
  .drop{display:block;border:2px dashed var(--border);border-radius:12px;padding:26px;text-align:center;color:var(--muted);font-size:13px;background:var(--plane);cursor:pointer;transition:border-color .12s,background .12s}
  .drop.over,.drop:hover{border-color:var(--series-1);color:var(--series-1)}
  /* table */
  table.data{border-collapse:collapse;width:100%;font-size:13px;background:var(--surface-1);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  table.data th{background:var(--series-1-soft);color:var(--seq-700);text-align:left;padding:9px 11px;font-size:11.5px;font-weight:700;white-space:nowrap}
  :root[data-theme="dark"] table.data th{color:#dbe9ff;background:#17324f}
  table.data td{padding:8px 11px;border-top:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums}
  table.data tbody tr:hover{background:var(--plane)}
  .src{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px}
  .src.seed{background:var(--warn-soft);color:var(--warn)}
  .src.manual{background:var(--series-1-soft);color:var(--seq-700)}
  .src.ocr{background:#e7f6ee;color:#0a7a43}
  .src.import{background:#eee;color:#555}
  .src.drive{background:#eef;color:#4a3aa7}
  .src.posted{background:#e7f6ee;color:#0a7a43;cursor:pointer}
  :root[data-theme="dark"] .src.manual{color:#dbe9ff}
  :root[data-theme="dark"] .src.import{background:#333;color:#bbb}
  .del{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
  .del:hover{color:#d03b3b}
  .edit{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
  .edit:hover{color:var(--series-1)}
  /* charts */
  .chart-card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 17px 10px}
  .chart-card h3{margin:0;font-size:14px;font-weight:700}.chart-card .cs{font-size:11.5px;color:var(--muted);margin:2px 0 6px}
  .charts2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:760px){.charts2{grid-template-columns:1fr}}
  svg.chart{width:100%;height:auto;display:block;overflow:visible}
  .tick{fill:var(--muted);font-size:10px;font-family:var(--font);font-variant-numeric:tabular-nums}
  .gridline{stroke:var(--grid);stroke-width:1}.baseline{stroke:var(--axis);stroke-width:1}
  .bar{fill:var(--series-1)}.bar:hover{opacity:.82;cursor:pointer}
  .linepath{fill:none;stroke:var(--series-1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .area{fill:var(--series-1);opacity:.08}.dot-m{fill:var(--surface-1);stroke:var(--series-1);stroke-width:2}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 10px;border:1px dashed var(--border);border-radius:12px}
  /* goals */
  .goalcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:12px}
  .goal-row{margin-top:12px}
  .goal-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-secondary);margin-bottom:5px}
  .goal-top b{font-variant-numeric:tabular-nums;color:var(--text-primary);font-weight:650;white-space:nowrap}
  .gbar{height:8px;background:var(--grid);border-radius:999px;overflow:hidden}
  .gfill{height:100%;background:var(--series-1);border-radius:999px;transition:width .3s}
  .gfill.done{background:var(--good)}
  .goal-h{font-size:13px;font-weight:700;margin:0}
  .sect{margin:26px 0 8px;font-size:15px;font-weight:700}
  /* images */
  .thumb{width:42px;height:42px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--border);cursor:pointer;background:var(--plane);display:block}
  .thumb.sm{width:34px;height:34px}
  .imgprev{max-width:230px;max-height:300px;object-fit:contain;border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow);display:block;background:var(--plane)}
  .addwrap{display:grid;grid-template-columns:minmax(0,640px);gap:14px}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;z-index:50;padding:20px}
  .modal-bg.open{display:grid}
  .modal{background:var(--surface-1);border:1px solid var(--border);border-radius:16px;max-width:480px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 10px;font-size:17px}
  .modal p{font-size:13.5px;color:var(--text-secondary);line-height:1.6}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text-primary);
    color:var(--surface-1);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.2s;z-index:60;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .tooltip{position:fixed;pointer-events:none;z-index:70;background:var(--text-primary);color:var(--surface-1);font-size:12px;padding:6px 9px;border-radius:8px;opacity:0;transition:opacity .1s;white-space:nowrap;font-variant-numeric:tabular-nums}
  .hide{display:none!important}
</style>
</head>

<script>
/* ============ 유틸 ============ */
const $=s=>document.querySelector(s), root=document.documentElement;
const pad=n=>String(n).padStart(2,'0');
const WD=['일','월','화','수','목','금','토'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function paceTxt(s){if(!s&&s!==0)return '—';return Math.floor(s/60)+"'"+pad(Math.round(s%60))+'"';}
function clock(s){if(!s&&s!==0)return '—';const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.round(s%60);return h?h+':'+pad(m)+':'+pad(x):m+':'+pad(x);}
function parsePace(t){const m=(t||'').match(/(\d+)\s*['′’:]\s*(\d{1,2})/);return m?(+m[1]*60+ +m[2]):null;}
function parseClock(t){t=(t||'').trim();if(!t)return null;const p=t.split(':').map(Number);if(p.some(isNaN))return null;
  if(p.length===3)return p[0]*3600+p[1]*60+p[2];if(p.length===2)return p[0]*60+p[1];if(p.length===1)return p[0]*60;return null;}
function isoWeekKey(d){const dt=new Date(d+'T00:00:00');const day=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-day);return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
const monthKey=d=>String(d).slice(0,7);
const yearKey=d=>String(d).slice(0,4);
function todayISO(){const t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900);}

/* ============ 상태 ============ */
const state={records:[], goals:null, backend:'local', pendingImage:null, pendingRawOcr:null, editingId:null,
  pendingDrive:null, driveQueue:null, driveTotal:0};

/* ============ 영속화 (localStorage) ============ */
const LS_RECORDS='run.records.v2', LS_GOALS='run.goals.v1';
const NUM_FIELDS=['distance_km','duration_sec','avg_pace_sec_per_km','elevation_gain_m','cadence_spm','avg_heart_rate_bpm'];
let _idSeq=0;
function migrateRecord(r){
  if(!r||typeof r!=='object')return r;
  delete r.calories;r.schema_version='2.0';
  NUM_FIELDS.forEach(k=>{if(r[k]!=null){const n=Number(r[k]);r[k]=isFinite(n)?n:null;}});
  if(r.title!=null)r.title=String(r.title);
  if(r.location!=null)r.location=String(r.location);
  if(r.image_url!=null){const u=String(r.image_url).trim(); /* javascript: 등 위험 스킴 차단 */
    r.image_url=(/^https?:\/\//i.test(u)||!u.includes(':'))&&u?u:null;}
  if(r.blog_posted_at!=null)r.blog_posted_at=String(r.blog_posted_at);
  return r;
}
function normalizeRecords(arr){ /* 외부 JSON 유입 대비: 날짜 형식·record_id 검증/재발급 */
  const seen=new Set();
  return arr.filter(r=>r&&typeof r==='object'&&/^\d{4}-\d{2}-\d{2}$/.test(String(r.date||''))).map(r=>{
    r=migrateRecord(r);r.date=String(r.date);
    if(!r.record_id||!/^[A-Za-z0-9_-]+$/.test(String(r.record_id))||seen.has(r.record_id))
      r.record_id='r'+Date.now()+'_'+(_idSeq++);
    else r.record_id=String(r.record_id);
    seen.add(r.record_id);
    return r;
  });
}
function loadRecords(){
  try{const j=JSON.parse(localStorage.getItem(LS_RECORDS)||'[]');return Array.isArray(j)?normalizeRecords(j):[];}
  catch(e){return [];}
}
function saveRecords(){
  try{localStorage.setItem(LS_RECORDS,JSON.stringify(state.records));}
  catch(e){toast('저장 공간이 부족합니다 — JSON 내보내기 후 오래된 기록을 정리하세요');}
}
function defaultGoals(){return {weekly:{distance_km:null,runs:3}, monthly:{distance_km:null,runs:15}, yearly:{distance_km:null,runs:180}};}
function sanitizeGoals(g){ /* 외부 JSON 유입 대비: 유한 양수만 허용 */
  const d=defaultGoals(),n=v=>{const x=Number(v);return isFinite(x)&&x>0?x:null;};
  const pick=(src,def)=>{if(!src||typeof src!=='object')return {...def};
    return {distance_km:'distance_km'in src?n(src.distance_km):def.distance_km, runs:'runs'in src?n(src.runs):def.runs};};
  g=g&&typeof g==='object'?g:null;
  return {weekly:pick(g&&g.weekly,d.weekly), monthly:pick(g&&g.monthly,d.monthly), yearly:pick(g&&g.yearly,d.yearly)};
}
function loadGoals(){
  try{return sanitizeGoals(JSON.parse(localStorage.getItem(LS_GOALS)));}
  catch(e){return defaultGoals();}
}
function saveGoals(){try{localStorage.setItem(LS_GOALS,JSON.stringify(state.goals));}catch(e){toast('목표 저장 실패(저장 공간 부족)');}}

/* ============ 이미지 저장 (IndexedDB) ============ */
let _dbp=null;
function idb(){
  if(!_dbp){_dbp=new Promise((res,rej)=>{
    if(!window.indexedDB){rej(new Error('IndexedDB 미지원'));return;}
    const rq=indexedDB.open('run-app',1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore('images');
    rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});
    _dbp.catch(()=>{_dbp=null;});}
  return _dbp;
}
function txDone(tx,res,rej){tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('IDB 트랜잭션 중단(저장 공간 부족 가능)'));}
async function imgPut(id,blob){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(blob,id);txDone(tx,res,rej);});}
async function imgGet(id){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('images');const rq=tx.objectStore('images').get(id);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);tx.onabort=()=>rej(tx.error||new Error('IDB 트랜잭션 중단'));});}
async function imgDel(id){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').delete(id);txDone(tx,res,rej);});}
async function imgClear(){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').clear();txDone(tx,res,rej);});}
const objUrls=new Map();
async function imgUrl(rec){
  if(rec.has_image){
    if(objUrls.has(rec.record_id))return objUrls.get(rec.record_id);
    try{const b=await imgGet(rec.record_id);if(b){const u=URL.createObjectURL(b);objUrls.set(rec.record_id,u);return u;}}catch(e){}
    return rec.image_url||null;
  }
  return rec.image_url||null;
}
function revokeImg(id){if(objUrls.has(id)){URL.revokeObjectURL(objUrls.get(id));objUrls.delete(id);}}
async function hydrateThumbs(){
  for(const img of document.querySelectorAll('img[data-rid]')){
    const rec=state.records.find(r=>r.record_id===img.dataset.rid);
    if(!rec)continue;
    const drop=()=>{if(img.parentElement&&img.parentElement.classList.contains('thumbwrap'))img.parentElement.remove();};
    const u=await imgUrl(rec);
    if(u){img.onerror=drop;img.src=u;}else drop();
  }
}

/* ============ 구글드라이브 연동 (GIS + Picker · drive.file 최소 스코프) ============ */
const DRIVE_SETTINGS_KEY='run.drive.v1'; // {clientId, apiKey, appId, jsonFileId} — 이 브라우저에만 저장
function driveSettings(){try{return JSON.parse(localStorage.getItem(DRIVE_SETTINGS_KEY))||{};}catch(e){return {};}}
function saveDriveSettings(s){try{localStorage.setItem(DRIVE_SETTINGS_KEY,JSON.stringify(s));}catch(e){toast('설정 저장 실패');}}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=()=>rej(new Error('스크립트 로드 실패'));document.head.appendChild(s);});}
let _gsiP=null,_pickerP=null,_gisToken=null,_gisTokenExp=0,_tokenClient=null;
async function ensureGoogleLibs(){
  if(!(window.google&&google.accounts&&google.accounts.oauth2)){
    if(!_gsiP){_gsiP=loadScript('https://accounts.google.com/gsi/client');_gsiP.catch(()=>{_gsiP=null;});}
    await _gsiP;
  }
  if(!(window.google&&google.picker)){
    if(!_pickerP){_pickerP=(window.gapi?Promise.resolve():loadScript('https://apis.google.com/js/api.js')).then(()=>new Promise(r=>gapi.load('picker',r)));_pickerP.catch(()=>{_pickerP=null;});}
    await _pickerP;
  }
}
async function driveToken(){
  const s=driveSettings();
  if(!s.clientId)throw new Error('Client ID 미설정');
  if(_gisToken&&Date.now()<_gisTokenExp-60000)return _gisToken; /* 토큰은 메모리에만 보관 */
  await ensureGoogleLibs();
  return new Promise((res,rej)=>{
    try{
      _tokenClient=google.accounts.oauth2.initTokenClient({
        client_id:s.clientId,
        /* drive.file: 앱 생성 파일 쓰기(정본 백업) · drive.readonly: 폴더 고정/탐색 뷰(Picker 403 방지) */
        scope:'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly',
        callback:t=>{
          if(t&&t.access_token){_gisToken=t.access_token;_gisTokenExp=Date.now()+((+t.expires_in||3600)*1000);res(_gisToken);}
          else rej(new Error((t&&t.error)||'토큰 발급 실패'));
        },
        error_callback:e=>rej(new Error(e&&e.type==='popup_closed'?'로그인 창이 닫혔습니다':(e&&e.message)||'인증 오류'))
      });
      _tokenClient.requestAccessToken({prompt:''});
    }catch(e){rej(e);}
  });
}
async function openDrivePicker(){
  const s=driveSettings();
  if(!s.clientId||!s.apiKey){openDriveSetup();return;}
  try{
    const token=await driveToken();
    await ensureGoogleLibs();
    const view=new google.picker.DocsView(google.picker.ViewId.DOCS_IMAGES).setIncludeFolders(true);
    if(s.folderId)view.setParent(s.folderId); /* 기본 폴더 지정 시 그 폴더에서 바로 열림 */
    const b=new google.picker.PickerBuilder()
      .setOAuthToken(token).setDeveloperKey(s.apiKey).addView(view)
      .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
      .setTitle('러닝 캡쳐 선택'+(s.folderName?' — '+s.folderName:'')).setCallback(pickerCb);
    if(s.appId)b.setAppId(s.appId);
    b.build().setVisible(true);
  }catch(e){toast('드라이브 연결 실패: '+((e&&e.message)||e));}
}
async function pickDriveFolder(){ /* 기본 캡쳐 폴더 1회 지정 → 이후 선택창이 바로 그 폴더에서 열림 */
  const s=driveSettings();
  if(!s.clientId||!s.apiKey){openDriveSetup();return;}
  try{
    const token=await driveToken();
    await ensureGoogleLibs();
    const view=new google.picker.DocsView(google.picker.ViewId.FOLDERS)
      .setSelectFolderEnabled(true).setMimeTypes('application/vnd.google-apps.folder');
    const b=new google.picker.PickerBuilder()
      .setOAuthToken(token).setDeveloperKey(s.apiKey).addView(view)
      .setTitle('기본 캡쳐 폴더 선택')
      .setCallback(d=>{
        if(!(window.google&&google.picker)||d.action!==google.picker.Action.PICKED)return;
        const f=(d.docs||[])[0];if(!f||!f.id)return;
        const cur=driveSettings();cur.folderId=f.id;cur.folderName=f.name||null;saveDriveSettings(cur);
        toast('기본 폴더 지정: '+(f.name||f.id));
        if(current==='data')renderData();
      });
    if(s.appId)b.setAppId(s.appId);
    b.build().setVisible(true);
  }catch(e){toast('폴더 선택 실패: '+((e&&e.message)||e));}
}
function clearDriveFolder(){
  const s=driveSettings();delete s.folderId;delete s.folderName;saveDriveSettings(s);
  toast('기본 폴더를 해제했습니다');closeModal();

}
function pickerCb(data){
  if(!(window.google&&google.picker)||data.action!==google.picker.Action.PICKED)return;
  processDriveFiles(data.docs||[]);
}
function processDriveFiles(docs){
  const existing=new Set(state.records.map(r=>r.source_file_id).filter(Boolean));
  const fresh=docs.filter(d=>d&&d.id&&!existing.has(d.id));
  const skipped=docs.length-fresh.length;
  if(skipped)toast('이미 가져온 캡쳐 '+skipped+'건은 건너뜁니다');
  if(!fresh.length)return;
  show('add');
  state.driveQueue=fresh.slice();
  state.driveTotal=fresh.length;
  nextDriveItem();
}
async function nextDriveItem(){
  if(!state.driveQueue||!state.driveQueue.length){state.driveQueue=null;state.driveTotal=0;return;}
  const item=state.driveQueue.shift();
  const pos=state.driveTotal-state.driveQueue.length;
  if(current!=='add'||!$('#ocrStatus'))return;
  $('#ocrStatus').textContent='드라이브에서 다운로드 중… ('+pos+'/'+state.driveTotal+' · '+item.name+')';
  try{
    const blob=await downloadDriveFile(item.id);
    if(current!=='add')return;
    state.pendingDrive={id:item.id,name:item.name||'capture.png'};
    handleFile(new File([blob],item.name||'capture.png',{type:blob.type||'image/png'}));
  }catch(e){
    toast((item.name||'파일')+' 다운로드 실패');
    nextDriveItem();
  }
}
async function downloadDriveFile(id){
  const token=await driveToken();
  const r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?alt=media',{headers:{Authorization:'Bearer '+token}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.blob();
}
async function backupToDrive(){
  const s=driveSettings();
  if(!s.clientId){openDriveSetup();return;}
  try{
    const token=await driveToken();
    const doUpload=fileId=>{
      const boundary='run_boundary_20260726';
      const meta={name:'running_records.json',mimeType:'application/json'};
      const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+
        '\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(datasetOut(),null,2)+'\r\n--'+boundary+'--';
      const url=fileId?'https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(fileId)+'?uploadType=multipart'
                      :'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
      return fetch(url,{method:fileId?'PATCH':'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'multipart/related; boundary='+boundary},body});
    };
    let r=await doUpload(s.jsonFileId||null);
    if(r.status===404&&s.jsonFileId){s.jsonFileId=null;saveDriveSettings(s);r=await doUpload(null);} /* 드라이브에서 파일 삭제된 경우 새로 생성 */
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j.id&&j.id!==s.jsonFileId){s.jsonFileId=j.id;saveDriveSettings(s);}
    toast('드라이브에 정본을 저장했습니다 ('+state.records.length+'건)');
  }catch(e){toast('드라이브 백업 실패: '+((e&&e.message)||e));}
}

const BLOG_SETTINGS_KEY='run.blog.v1'; // {blogId, categoryNo, autoOpen} — 이 브라우저에만 저장
function blogSettings(){try{return JSON.parse(localStorage.getItem(BLOG_SETTINGS_KEY))||{};}catch(e){return {};}}
function saveBlogSettings(s){try{localStorage.setItem(BLOG_SETTINGS_KEY,JSON.stringify(s));}catch(e){toast('설정 저장 실패');}}
function blogTitle(rec){return rec.date.slice(2).replace(/-/g,'.')+' - '+(Math.round((rec.distance_km||0)*10)/10).toFixed(1)+'KM';}
function naverWriteUrl(){const s=blogSettings();if(!s.blogId)return null;
  return 'https://blog.naver.com/'+encodeURIComponent(s.blogId)+'?Redirect=Write'+(s.categoryNo?'&categoryNo='+encodeURIComponent(s.categoryNo):'');}
function blogUnposted(){return state.records.filter(r=>(r.has_image||r.image_url)&&!r.blog_posted_at);}
const canCopyImg=()=>!!(navigator.clipboard&&navigator.clipboard.write&&window.ClipboardItem);
async function blobToPngBlob(blob){ /* Chromium 클립보드는 image/png만 허용 */
  if(blob.type==='image/png')return blob;
  const bmp=await createImageBitmap(blob);
  const c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;
  c.getContext('2d').drawImage(bmp,0,0);bmp.close();
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('PNG 변환 실패')),'image/png'));
}
let _blogDraftId=null,_blogDraftBlob=null,_blogDraftFile=null;
async function openBlogDraft(id){
  const rec=state.records.find(r=>r.record_id===id);if(!rec)return;
  _blogDraftId=id;_blogDraftBlob=null;_blogDraftFile=null;
  const title=blogTitle(rec);
  if(rec.has_image){try{_blogDraftBlob=(await imgGet(rec.record_id))||null;}catch(e){}}
  if(!_blogDraftBlob&&rec.image_url){try{_blogDraftBlob=await (await fetch(rec.image_url)).blob();}catch(e){}} /* 시드 등 정적 이미지 */
  const u=await imgUrl(rec);
  if(_blogDraftBlob){const ext=(_blogDraftBlob.type||'').includes('png')?'png':'jpg';
    _blogDraftFile=new File([_blogDraftBlob],rec.date+'.'+ext,{type:_blogDraftBlob.type||'image/jpeg'});}
  const canShare=!!(_blogDraftFile&&navigator.canShare&&navigator.canShare({files:[_blogDraftFile]}));
  const copyBtn=_blogDraftBlob&&canCopyImg()?`<button class="btn sm" onclick="copyBlogImage()">🖼 이미지 복사</button>`:'';
  const shareBtn=canShare?`<button class="btn sm${copyBtn?' sec':''}" onclick="shareBlogDraft()">📤 이미지·제목 공유</button>`:'';
  const dlBtn=_blogDraftBlob&&!copyBtn&&!shareBtn?`<button class="btn sm sec" onclick="downloadBlogImage()">⬇ 이미지 저장</button>`:'';
  const writeBtn=blogSettings().blogId?`<button class="btn sm sec" onclick="openNaverWrite()">✍ 네이버 글쓰기 열기</button>`
    :`<button class="btn sm sec" onclick="closeModal();openBlogSetup()">⚙ 블로그 설정 먼저 →</button>`;
  openModal(`<h3>블로그 글감</h3>
    ${rec.blog_posted_at?`<p style="font-size:12px;color:var(--good-text);margin:0 0 8px">✅ 이미 발행됨 · ${esc(String(rec.blog_posted_at).slice(0,16).replace('T',' '))} — <a href="#" onclick="unmarkBlogPosted('${esc(id)}');return false">표시 해제</a></p>`:''}
    <div class="field" style="margin-bottom:10px"><label>제목</label>
      <div style="display:flex;gap:8px"><input id="bg_title" readonly value="${esc(title)}" style="font-family:var(--mono)">
      <button class="btn sm sec" style="flex:none" onclick="copyBlogTitle()">📋 복사</button></div></div>
    ${u?`<img src="${esc(u)}" alt="캡쳐" style="max-width:100%;max-height:220px;border-radius:10px;display:block;margin:0 auto 10px">`
      :`<div class="note warn" style="margin-bottom:10px">이 기록에는 사진이 없습니다 — 제목만 사용할 수 있어요.</div>`}
    <div class="note">① 이미지 복사 → ② 글쓰기 창 열기 → ③ 본문에 붙여넣기(Ctrl+V) → ④ 제목 붙여넣기 → ⑤ 발행 후 아래 <b>발행 완료</b>를 눌러주세요.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${copyBtn}${shareBtn}${dlBtn}${writeBtn}</div>
    <div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end">
      <button class="btn sec" onclick="closeModal()">닫기</button>
      ${rec.blog_posted_at?'':`<button class="btn" onclick="markBlogPosted('${esc(id)}')">✅ 발행 완료로 표시</button>`}</div>`);
}
function copyBlogTitle(){
  const el=$('#bg_title');if(!el)return;
  const fb=()=>{el.select();document.execCommand('copy');toast('제목을 복사했습니다');};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(el.value).then(()=>toast('제목을 복사했습니다'),fb);
  else fb();
}
function copyBlogImage(){ /* 클릭 핸들러에서 동기 호출 필수 — Safari는 async 후 write 시 제스처 소실 */
  if(!_blogDraftBlob){toast('사진이 없습니다');return;}
  const ok=()=>toast('이미지를 복사했습니다 — 에디터 본문에 붙여넣으세요');
  const fail=()=>toast('이미지 복사 실패 — 이미지 저장 후 첨부해주세요');
  try{navigator.clipboard.write([new ClipboardItem({'image/png':blobToPngBlob(_blogDraftBlob)})]).then(ok,fail);}
  catch(e){ /* ClipboardItem에 Promise 미지원(구형 Chromium) → 변환 후 재시도 */
    blobToPngBlob(_blogDraftBlob).then(b=>navigator.clipboard.write([new ClipboardItem({'image/png':b})])).then(ok,fail);}
}
function shareBlogDraft(){
  const rec=state.records.find(r=>r.record_id===_blogDraftId);
  if(!rec||!_blogDraftFile)return;
  navigator.share({files:[_blogDraftFile],title:blogTitle(rec),text:blogTitle(rec)}).catch(()=>{});
}
function downloadBlogImage(){
  const rec=state.records.find(r=>r.record_id===_blogDraftId);
  if(!rec||!_blogDraftBlob)return;
  const a=document.createElement('a');const u=URL.createObjectURL(_blogDraftBlob);
  a.href=u;a.download=_blogDraftFile?_blogDraftFile.name:rec.date+'.jpg';a.click();

/* ============ 추출 엔진 ============ */
function calcConsistency(r){
  if(r.distance_km&&r.avg_pace_sec_per_km&&!r.duration_sec) r.duration_sec=Math.round(r.distance_km*r.avg_pace_sec_per_km);
  if(r.distance_km&&r.duration_sec&&!r.avg_pace_sec_per_km) r.avg_pace_sec_per_km=Math.round(r.duration_sec/r.distance_km);
  return r;
}
function parseRunningText(t){
  const r={};let m;
  m=t.match(/(오늘|어제)\s*[-–—]?\s*(\d{1,2}:\d{2})/);
  if(m){const dt=new Date();if(m[1]==='어제')dt.setDate(dt.getDate()-1);
    r.date=dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
    r.start_time=m[2].length===4?'0'+m[2]:m[2];}
  m=t.match(/(\d+[.,]\d+)\s*(?:킬로미터|km|㎞)/i)||t.match(/(?:킬로미터|km|거리)[^\d]{0,8}(\d+[.,]\d+)/i);
  if(m)r.distance_km=parseFloat(m[1].replace(',','.'));
  if(!r.distance_km){m=t.match(/^\s*(\d{1,3}[.,]\d{1,2})\s*$/m);if(m)r.distance_km=parseFloat(m[1].replace(',','.'));} /* NRC 대형 숫자: 라벨 없이 단독 라인 */
  m=t.match(/(\d+)\s*['′’]\s*(\d{1,2})/); if(m)r.avg_pace_sec_per_km=+m[1]*60+ +m[2];
  m=t.match(/(\d{1,2}:\d{2}(?::\d{2})?)\s*\n?\s*시간/);
  if(m)r.duration_sec=parseClock(m[1]);
  else{const all=[...t.matchAll(/\d{1,2}:\d{2}(?::\d{2})?/g)].map(x=>x[0]).filter(x=>x!==r.start_time);
    if(all.length)r.duration_sec=parseClock(all[all.length-1]);}
  m=t.match(/(\d{2,3})\s*\n?\s*(?:spm|케이던스)/i); if(m)r.cadence_spm=+m[1];
  m=t.match(/(\d{2,3})\s*\n?\s*(?:bpm|(?:평균\s*)?심박)/i); if(m)r.avg_heart_rate_bpm=+m[1];
  m=t.match(/(\d+(?:[.,]\d+)?)\s*m\s*\n?\s*고도/)||t.match(/고도\s*상승?\s*[^\d]{0,6}(\d+)/);
  if(m)r.elevation_gain_m=Math.round(parseFloat(String(m[1]).replace(',','.')));
  if(r.elevation_gain_m==null){m=t.match(/(?:^|\s)(\d{1,4})\s*m(?:\s|$)/m);if(m)r.elevation_gain_m=+m[1];} /* 라벨 유실 시 'N m' 단독 표기 */
  m=t.match(/[가-힣A-Za-z ]{0,14}러닝/); if(m)r.title=m[0].trim();
  m=t.match(/[가-힣]+(?:특별시|광역시|특별자치시|특별자치도)(?:\s*,\s*[가-힣]+)?/); if(m)r.location=m[0].replace(/\s*,\s*/,', ');
  return r;
}
let _tessP=null;
function loadTesseract(){
  if(window.Tesseract)return Promise.resolve();
  if(!_tessP){_tessP=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.async=true;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s);});
    _tessP.catch(()=>{_tessP=null;});}
  return _tessP;
}
async function runOCR(file,cb){
  try{await loadTesseract();}
  catch(e){cb(null,'OCR 엔진(Tesseract.js)을 불러오지 못했습니다 — 네트워크가 없거나 차단된 환경입니다.');return;}
  try{const {data}=await Tesseract.recognize(file,'kor+eng');cb(parseRunningText(data.text),null,data.text);}
  catch(e){cb(null,'인식 실패: '+e.message);}
}

/* ============ 집계 ============ */
function agg(){
  const r=state.records;
  const tot=r.reduce((a,x)=>({d:a.d+(x.distance_km||0),t:a.t+(x.duration_sec||0)}),{d:0,t:0});
  const paced=r.filter(x=>x.avg_pace_sec_per_km&&x.distance_km);
  const pd=paced.reduce((a,x)=>a+x.distance_km,0);
  const avgPace=pd?paced.reduce((a,x)=>a+x.avg_pace_sec_per_km*x.distance_km,0)/pd:null;
  const longest=r.reduce((m,x)=>(x.distance_km>(m?.distance_km||0)?x:m),null);
  const fastest=r.filter(x=>x.avg_pace_sec_per_km).reduce((m,x)=>(x.avg_pace_sec_per_km<(m?.avg_pace_sec_per_km||1e9)?x:m),null);
  return {n:r.length,...tot,avgPace,longest,fastest};
}
function periodTotals(keyFn,key){
  let dist=0,runs=0;
  state.records.forEach(x=>{if(x.date&&keyFn(x.date)===key){dist+=x.distance_km||0;runs++;}});
  return {dist,runs};
}
function goalProgress(){
  const t=todayISO();
  return {weekly:periodTotals(isoWeekKey,isoWeekKey(t)), monthly:periodTotals(monthKey,monthKey(t)), yearly:periodTotals(yearKey,yearKey(t))};
}
function goalBarHTML(label,actual,target,unit){
  if(!target)return '';

  const pct=Math.round(actual/target*100);
  const at=unit==='km'?(Math.round(actual*100)/100):actual;
  return `<div class="goal-row"><div class="goal-top"><span>${label}</span><b>${at} / ${target}${unit} · ${pct}%${done?' ✓':''}</b></div>
    <div class="gbar"><div class="gfill${done?' done':''}" style="width:${Math.min(100,done?100:Math.min(pct,99))}%"></div></div></div>`;
}
function goalCard(title,goal,prog){

function handleFile(f){

  runOCR(f,(parsed,err,raw)=>{
    /* 스테일 가드: 뷰를 떠났다 돌아온 뒤 도착한 이전 사진의 콜백 차단 */

    state.pendingRawOcr=raw||null;
    applyPrefill(parsed||{});
    $('#ocrStatus').innerHTML='✅ 인식 완료 — 값을 확인하고 필요하면 수정한 뒤 저장하세요. (빈 칸만 자동으로 채웠습니다)';

  setIf('f_dist',p.distance_km);setIf('f_pace',p.avg_pace_sec_per_km?paceTxt(p.avg_pace_sec_per_km):null);
  setIf('f_dur',p.duration_sec?clock(p.duration_sec):null);setIf('f_elev',p.elevation_gain_m);
  setIf('f_cad',p.cadence_spm);setIf('f_hr',p.avg_heart_rate_bpm);
}
let _saving=false;
async function saveRecord(){
  if(_saving)return; /* await imgPut 중 재클릭으로 인한 중복 저장 차단 */
  _saving=true;
  try{await _saveRecordInner();}finally{_saving=false;}
}
async function _saveRecordInner(){
  const g=id=>{const el=$('#'+id);return el?el.value.trim():'';};
  if(!g('f_date')||!g('f_dist')){toast('날짜와 거리는 필수입니다');return;}
  const d=g('f_date'),tm=g('f_time');
  const fields=calcConsistency({
    date:d, weekday:WD[new Date(d+'T00:00:00').getDay()],
    start_time:tm||null, day_part: tm? (+tm.slice(0,2)<12?'오전':'오후') : null,
    title:g('f_title')||'러닝', location:g('f_loc')||null,
    distance_km:parseFloat(g('f_dist')),
    avg_pace_sec_per_km:parsePace(g('f_pace')), duration_sec:parseClock(g('f_dur')),
    elevation_gain_m:g('f_elev')?Math.round(+g('f_elev')):null,
    cadence_spm:+g('f_cad')||null, avg_heart_rate_bpm:+g('f_hr')||null
  });
  if(!(fields.distance_km>0)){toast('거리는 0보다 큰 숫자여야 합니다');return;}
  const editing=state.editingId?state.records.find(r=>r.record_id===state.editingId):null;
  let rec;
  if(editing){rec=Object.assign(editing,fields);}
  else{
    rec={record_id:'r'+Date.now(), ...fields,
      source:state.pendingDrive?'drive':(state.pendingImage?'ocr':'manual'),
      source_file_id:state.pendingDrive?state.pendingDrive.id:null,
      original_filename:state.pendingDrive?state.pendingDrive.name:null,
      has_image:false, image_url:null, raw_ocr:state.pendingRawOcr||null,
      created_at:new Date().toISOString(), schema_version:'2.0'};
    state.records.push(rec);
  }
  if(state.pendingImage){
    try{await imgPut(rec.record_id,state.pendingImage);revokeImg(rec.record_id);rec.has_image=true;
      if(state.pendingRawOcr)rec.raw_ocr=state.pendingRawOcr;}
    catch(e){toast('사진 저장에 실패했습니다 — 기록만 저장됩니다');}
  }
  state.records.sort((a,b)=>a.date<b.date?-1:1);
  saveRecords();setPill();
  const wasEdit=!!editing,wasQueue=state.driveTotal>0; /* show()가 driveTotal을 초기화하므로 먼저 캡처 */
  state.pendingImage=null;state.pendingRawOcr=null;state.editingId=null;state.pendingDrive=null;
  toast(wasEdit?'기록이 수정되었습니다':'저장되었습니다 · 총 '+state.records.length+'건');
  if(state.driveQueue&&state.driveQueue.length){show('add');nextDriveItem();} /* 드라이브 큐 이어서 처리 */
  else{
    state.driveQueue=null;state.driveTotal=0;show('dashboard');
    const bs=blogSettings(); /* 블로그 글감 — 단건 신규 저장은 자동 오픈, 드라이브 큐는 소진 후 일괄 안내 (blog.html) */
    if(bs.blogId&&bs.autoOpen!==false){
      if(!wasEdit&&!wasQueue)openBlogDraft(rec.record_id);
      else if(wasQueue&&blogUnposted().length)openBlogQueue();
    }
  }
}
function editRec(id){state.editingId=id;state.pendingImage=null;state.pendingRawOcr=null;show('add');}

function lastWeeks(n){
  const out=[];const cur=new Date(isoWeekKey(todayISO())+'T00:00:00');
  for(let i=0;i<n;i++){out.push(cur.getFullYear()+'-'+pad(cur.getMonth()+1)+'-'+pad(cur.getDate()));cur.setDate(cur.getDate()-7);}
  return out;
}
function lastMonths(n){
  const out=[];const t=new Date();let y=t.getFullYear(),m=t.getMonth()+1;
  for(let i=0;i<n;i++){out.push(y+'-'+pad(m));m--;if(m===0){m=12;y--;}}
  return out;
}
function historyRows(keys,keyFn,goal,labelFn){
  return keys.map(k=>{
    const t=periodTotals(keyFn,k);
    const cell=(actual,target)=>{if(!target)return '<td>—</td>';
      const done=actual>=target; /* 원값 비교 */
      return `<td style="${done?'color:var(--good-text);font-weight:700':''}">${Math.round(actual/target*100)}%</td>`;};
    return `<tr><td>${labelFn(k)}</td><td>${t.runs}회</td><td>${t.dist.toFixed(1)}km</td>${cell(t.runs,goal.runs)}${cell(t.dist,goal.distance_km)}</tr>`;
  }).join('');
}

}

function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onerror=()=>{toast('파일을 읽지 못했습니다');e.target.value='';};
  rd.onload=()=>{
    try{
      const j=JSON.parse(rd.result);
      const recs=normalizeRecords(Array.isArray(j)?j:(Array.isArray(j.records)?j.records:[]));
      if(!recs.length){toast('가져올 기록이 없습니다 — 파일 형식을 확인하세요');e.target.value='';return;}
      if(!confirm('현재 기록 '+state.records.length+'건을 불러온 데이터 '+recs.length+'건으로 교체합니다. 계속할까요?')){e.target.value='';return;}
      recs.forEach(x=>{if(!x.source||x.source==='demo')x.source='import';});
      const newIds=new Set(recs.map(x=>x.record_id));
      state.records.forEach(x=>{if(!newIds.has(x.record_id)){revokeImg(x.record_id);imgDel(x.record_id).catch(()=>{});}}); /* 교체로 사라지는 레코드의 사진 정리 */
      state.records=recs.sort((a,b)=>a.date<b.date?-1:1);
      if(j.goals){state.goals=sanitizeGoals(j.goals);saveGoals();}
      saveRecords();setPill();toast('불러왔습니다 · '+recs.length+'건');renderData();
    }catch(x){toast('JSON을 읽을 수 없습니다');}
    e.target.value='';
  };
  rd.readAsText(f);
}
function delRec(id){
  state.records=state.records.filter(x=>x.record_id!==id);
  saveRecords();setPill();revokeImg(id);imgDel(id).catch(()=>{});
  toast('삭제됨');renderData();
}
function clearAll(){

  renderData();
}

const tip=$('#tip');
function bindHover(el){el.querySelectorAll('[data-t]').forEach(m=>{m.addEventListener('mousemove',e=>{tip.innerHTML=m.getAttribute('data-t');tip.style.opacity=1;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';});m.addEventListener('mouseleave',()=>tip.style.opacity=0);});}
function barChart(el,data){
  if(!data.length){el.innerHTML='<div class="empty">데이터 없음</div>';return;}
  const W=el.clientWidth||460,H=200,P={t:12,r:8,b:24,l:28};
  const iw=W-P.l-P.r,ih=H-P.t-P.b,max=Math.max(...data.map(d=>d.v),1)*1.12,bw=iw/data.length,bar=Math.min(30,bw*.6);
  const y=v=>P.t+ih-(v/max)*ih;let g='';
  [0,max/2,max].forEach(t=>{const yy=y(t);g+=`<line class="gridline" x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}"/><text class="tick" x="${P.l-5}" y="${yy+3}" text-anchor="end">${t.toFixed(0)}</text>`;});
  data.forEach((d,i)=>{const cx=P.l+bw*i+bw/2,yy=y(d.v);g+=`<rect class="bar" x="${cx-bar/2}" y="${yy}" width="${bar}" height="${Math.max(1,P.t+ih-yy)}" rx="4" data-t="${esc(d.w+' · <b>'+d.v.toFixed(1)+'km</b>')}"/><text class="tick" x="${cx}" y="${H-7}" text-anchor="middle">${esc(d.w)}</text>`;});
  el.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<line class="baseline" x1="${P.l}" y1="${P.t+ih}" x2="${W-P.r}" y2="${P.t+ih}"/></svg>`;bindHover(el);
}
function lineChart(el,data){
  if(data.length<2){el.innerHTML='<div class="empty">페이스 데이터가 2건 이상일 때 표시됩니다</div>';return;}
  const W=el.clientWidth||460,H=200,P={t:14,r:14,b:24,l:38};const iw=W-P.l-P.r,ih=H-P.t-P.b;
  const vs=data.map(d=>d.s),mn=Math.min(...vs)-6,mx=Math.max(...vs)+6;
  const x=i=>P.l+iw*i/(data.length-1),y=s=>P.t+ih-((s-mn)/(mx-mn||1))*ih;let g='';
  for(let k=0;k<=2;k++){const s=mn+(mx-mn)*k/2,yy=y(s);g+=`<line class="gridline" x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}"/><text class="tick" x="${P.l-5}" y="${yy+3}" text-anchor="end">${paceTxt(Math.round(s))}</text>`;}
  const pts=data.map((d,i)=>[x(i),y(d.s)]);
  g+=`<path class="area" d="M${pts[0][0]} ${P.t+ih} ${pts.map(p=>'L'+p[0]+' '+p[1]).join(' ')} L${pts.at(-1)[0]} ${P.t+ih} Z"/><path class="linepath" d="${pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ')}"/>`;
  data.forEach((d,i)=>{g+=`<circle class="dot-m" cx="${x(i)}" cy="${y(d.s)}" r="4"/><circle cx="${x(i)}" cy="${y(d.s)}" r="12" fill="transparent" data-t="${esc(d.d+' · <b>'+paceTxt(d.s)+'</b>')}"/><text class="tick" x="${x(i)}" y="${H-7}" text-anchor="middle">${esc(d.d)}</text>`;});
  el.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;bindHover(el);
}

});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* Tesseract 미리 로드 (실패해도 업로드 시 재시도) */
loadTesseract().catch(()=>{});

/* ============ 부트 ============ */
ensureSeed();
state.records=loadRecords();
state.goals=loadGoals();
saveRecords(); /* v1 → v2 마이그레이션 결과 즉시 반영 */
setPill();
show('dashboard');
</script>
